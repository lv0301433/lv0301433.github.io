<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Seagull Dogfight v19</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#03040a;overflow:hidden;
    font-family:Consolas,monospace;color:#7fffd4;user-select:none;
    touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;}
  canvas{display:block;background:#03040a;touch-action:none;}
  #skills{position:fixed;right:max(20px,env(safe-area-inset-right));
    bottom:max(20px,env(safe-area-inset-bottom));
    width:230px;height:190px;z-index:5;pointer-events:none;transition:opacity .3s;}
  #skills.hide{opacity:0;}
  .skill{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;
    color:#0ff;pointer-events:auto;transition:transform .1s cubic-bezier(.3,1.7,.5,1);
    filter:drop-shadow(0 0 12px rgba(0,255,255,.5));}
  .skill:active{transform:scale(.86);}
  .skill.off{color:#3a5560;filter:none;} .skill.off .ico{opacity:.4;} .skill.off .lbl{opacity:.4;}
  .skill .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
  .skill .ringBg{fill:rgba(0,26,36,.62);stroke:rgba(120,220,255,.22);stroke-width:3.5;}
  .skill .ringFg{fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;
    stroke-dasharray:289;stroke-dashoffset:0;transition:stroke-dashoffset .08s linear;}
  .skill .ico{position:absolute;inset:0;margin:auto;stroke:currentColor;fill:none;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .skill .lbl{position:absolute;left:0;right:0;bottom:9px;font-size:9px;
    letter-spacing:2.5px;font-weight:bold;color:currentColor;opacity:.78;}
  #bDash{right:0;bottom:0;width:98px;height:98px;} #bDash .ico{width:38px;height:38px;}
  #bBomb{right:116px;bottom:52px;width:76px;height:76px;color:#ffd166;
    filter:drop-shadow(0 0 12px rgba(255,209,102,.5));}
  #bBomb .ico{width:30px;height:30px;} #bBomb .lbl{bottom:7px;font-size:8px;}
  #admBtn{position:fixed;left:14px;top:14px;z-index:60;width:44px;height:32px;
    border:1.5px solid rgba(0,255,255,.4);border-radius:6px;
    background:rgba(0,26,36,.6);color:#0ff;font-family:inherit;font-size:10px;
    font-weight:bold;cursor:pointer;opacity:.45;transition:.2s;
    display:flex;align-items:center;justify-content:center;letter-spacing:1px;}
  #admBtn:hover,#admBtn:active{opacity:1;box-shadow:0 0 14px rgba(0,255,255,.6);}
  #adm{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;
    background:rgba(0,6,10,.96);}
  #adm.show{display:flex;}
  #admHead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:8px 14px;border-bottom:1px solid rgba(0,255,255,.25);
    background:rgba(0,20,28,.6);gap:8px;}
  #admTitle{font-size:13px;font-weight:bold;letter-spacing:4px;color:#0ff;}
  #admHint{font-size:10px;color:rgba(127,255,212,.5);letter-spacing:1px;}
  #admClose{background:transparent;border:1px solid #4dd2ff;color:#4dd2ff;
    padding:6px 14px;font-family:inherit;font-size:11px;font-weight:bold;
    letter-spacing:2px;cursor:pointer;border-radius:3px;min-height:32px;}
  #admClose:active{background:#4dd2ff;color:#022;}
  #admLog{flex:1;min-height:0;overflow-y:auto;padding:10px 14px;font-size:12px;
    line-height:1.55;-webkit-overflow-scrolling:touch;}
  .admLine{margin-bottom:3px;white-space:pre-wrap;word-break:break-all;}
  .admCmd{color:#4dd2ff;} .admOk{color:#7fffd4;}
  .admErr{color:#ff4d6d;} .admDim{color:rgba(127,255,212,.45);}
  #admInputWrap{flex:0 0 auto;display:flex;padding:8px 10px;
    border-top:1px solid rgba(0,255,255,.25);background:rgba(0,20,28,.6);
    align-items:center;gap:6px;}
  #admPrompt{color:#ffd166;font-weight:bold;font-size:14px;}
  #admInput{flex:1;background:transparent;border:0;outline:0;
    font-family:inherit;font-size:16px;color:#7fffd4;caret-color:#0ff;}
  #admInput::placeholder{color:rgba(127,255,212,.35);}
  #admAutocomplete{position:fixed;bottom:52px;left:10px;right:10px;
    background:rgba(0,20,28,.96);border:1px solid rgba(0,255,255,.35);
    border-radius:6px;max-height:180px;overflow-y:auto;display:none;z-index:201;}
  #admAutocomplete.show{display:block;}
  .acItem{padding:8px 12px;font-size:12px;color:#7fffd4;cursor:pointer;
    border-bottom:1px solid rgba(0,255,255,.08);}
  .acItem.sel{background:rgba(0,255,255,.12);color:#0ff;}
  .acItem .acN{font-weight:bold;color:#0ff;margin-right:8px;}
  .acItem .acD{color:rgba(127,255,212,.55);font-size:11px;}
  .ov{position:fixed;inset:0;display:none;flex-direction:column;
    background:radial-gradient(circle,rgba(0,20,30,.96),rgba(0,0,0,.98));
    z-index:100;overflow:hidden;}
  .ov.show{display:flex;}
  .ov-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;border-bottom:1px solid rgba(127,255,212,.2);
    background:rgba(0,15,22,.7);gap:8px;flex-wrap:wrap;}
  .ov-title{font-size:14px;font-weight:bold;letter-spacing:3px;color:#7fffd4;}
  .ov-close{background:transparent;border:1px solid #4dd2ff;color:#4dd2ff;
    padding:8px 16px;font-family:inherit;font-size:12px;font-weight:bold;
    letter-spacing:2px;cursor:pointer;border-radius:4px;min-height:36px;}
  .ov-close:active{background:#4dd2ff;color:#022;}
  .ov-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:10px 12px;}
  .ov-foot{flex:0 0 auto;padding:10px 12px;border-top:1px solid rgba(127,255,212,.2);
    background:rgba(0,15,22,.7);}
  #gachaGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));
    gap:8px;padding-bottom:8px;}
  .gitem{border:1.5px solid;border-radius:8px;padding:10px 6px;text-align:center;
    background:rgba(0,26,36,.7);}
  .gitem .gi{font-size:24px;line-height:1;margin-bottom:6px;font-weight:bold;}
  .gitem .gn{font-size:11px;font-weight:bold;line-height:1.25;}
  .gitem .gs{font-size:9px;opacity:.75;margin-top:4px;line-height:1.3;}
  #gachaBtnBar{display:flex;gap:10px;}
  .gbtn{flex:1;padding:14px 8px;border:1.5px solid;border-radius:8px;background:transparent;
    font-family:inherit;font-weight:bold;font-size:13px;letter-spacing:2px;
    cursor:pointer;transition:.15s;color:#7fffd4;border-color:#7fffd4;min-height:56px;}
  .gbtn:active{transform:scale(.97);background:rgba(127,255,212,.18);}
  .gbtn[data-k="ten"]{color:#ffd166;border-color:#ffd166;}
  .gbtn[data-k="ten"]:active{background:rgba(255,209,102,.18);}
  .gbtn small{display:block;font-size:10px;opacity:.75;margin-top:3px;letter-spacing:1px;}
  #slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;
    padding-bottom:10px;border-bottom:1px solid rgba(127,255,212,.15);
    margin-bottom:10px;}
  .slot{border:1.5px solid rgba(127,255,212,.4);border-radius:8px;
    background:rgba(0,20,28,.6);aspect-ratio:1;position:relative;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    cursor:pointer;padding:2px;overflow:hidden;}
  .slot.active{border-color:#ffd166;box-shadow:0 0 14px rgba(255,209,102,.7);}
  .slot .si{font-size:clamp(18px,4.5vw,26px);line-height:1;opacity:.35;font-weight:bold;}
  .slot.filled .si{opacity:1;}
  .slot .sl{font-size:8px;color:rgba(127,255,212,.7);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px;}
  #listLabel{font-size:11px;letter-spacing:2px;color:rgba(127,255,212,.6);padding:6px 0 8px;}
  #itemList{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));
    gap:6px;padding-bottom:20px;}
  .iitem{border:1.5px solid;border-radius:7px;padding:6px 4px;text-align:center;
    background:rgba(0,20,28,.75);cursor:pointer;transition:.1s;
    display:flex;flex-direction:column;gap:2px;min-height:74px;
    justify-content:center;align-items:center;position:relative;}
  .iitem:active{transform:scale(.94);background:rgba(0,40,55,.9);}
  .iitem.eq{box-shadow:inset 0 0 14px currentColor;background:rgba(0,50,65,.9);}
  .iitem .ii{font-size:20px;font-weight:bold;line-height:1;}
  .iitem .in{font-size:9.5px;font-weight:bold;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .iitem .iv{font-size:9px;opacity:.8;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .iitem .eq-mark{position:absolute;top:2px;right:4px;font-size:9px;
    color:#5aff9d;font-weight:bold;}
  #detail{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(340px,88vw);border:2px solid;border-radius:12px;padding:18px;
    background:rgba(0,20,28,.99);z-index:150;display:none;text-align:center;
    box-shadow:0 0 40px rgba(0,0,0,.9);}
  #detail.show{display:block;}
  #detail .di{font-size:44px;line-height:1;margin-bottom:8px;font-weight:bold;}
  #detail .dn{font-size:17px;font-weight:bold;letter-spacing:2px;margin-bottom:4px;}
  #detail .dr{font-size:11px;letter-spacing:4px;opacity:.75;margin-bottom:12px;}
  #detail .dd{font-size:13px;line-height:1.8;margin-bottom:16px;color:#cde;}
  #detail .dbtn{display:flex;gap:10px;}
  #detail button{flex:1;padding:12px 8px;font-family:inherit;font-weight:bold;
    font-size:13px;letter-spacing:2px;cursor:pointer;border-radius:6px;
    background:transparent;border:1.5px solid currentColor;color:inherit;
    min-height:44px;}
  #detail button:active{background:currentColor;color:#022;}
  #start{position:fixed;inset:0;z-index:80;display:flex;
    flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 42%,#061a22 0%,#03040a 65%);
    text-align:center;padding:20px;}
  .logo{font-size:clamp(26px,7vw,48px);font-weight:bold;letter-spacing:5px;
    color:#7fffd4;text-shadow:0 0 16px #0ff,0 0 48px rgba(0,255,255,.55);}
  .logo span{display:block;font-size:.42em;letter-spacing:11px;color:#4dd2ff;
    opacity:.8;margin-top:8px;}
  #coinBar{margin-top:20px;font-size:15px;color:#ffd166;font-weight:bold;
    cursor:pointer;text-shadow:0 0 10px rgba(255,209,102,.6);
    padding:8px 16px;user-select:none;}
  #coinBar:active{transform:scale(.95);}
  #startBtns{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;
    justify-content:center;max-width:520px;}
  #startBtns button{padding:14px 22px;font-size:14px;font-weight:bold;
    letter-spacing:3px;font-family:inherit;color:#0ff;cursor:pointer;
    background:rgba(0,255,255,.05);border:1.5px solid #0ff;border-radius:6px;
    min-height:50px;}
  #startBtns button:active{background:#0ff;color:#022;transform:scale(.96);}
  #startBtns button[data-k="gacha"]{color:#ffd166;border-color:#ffd166;
    background:rgba(255,209,102,.06);}
  #startBtns button[data-k="gacha"]:active{background:#ffd166;color:#022;}
  #startBtns button[data-k="equip"]{color:#c77dff;border-color:#c77dff;
    background:rgba(199,125,255,.06);}
  #startBtns button[data-k="equip"]:active{background:#c77dff;color:#022;}
  #startBtns button[data-k="continue"]{color:#5aff9d;border-color:#5aff9d;
    background:rgba(90,255,157,.08);}
  #startBtns button[data-k="continue"]:active{background:#5aff9d;color:#022;}
  #startBtns button[data-k="save"]{color:#4dd2ff;border-color:#4dd2ff;
    background:rgba(77,210,255,.06);}
  #startBtns button[data-k="save"]:active{background:#4dd2ff;color:#022;}
  .hint{margin:16px 0 0;font-size:11px;letter-spacing:2px;
    color:rgba(127,255,212,.55);line-height:1.9;max-width:520px;}
  #rotate{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;
    align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,#061a22,#03040a 70%);
    text-align:center;gap:26px;}
  #rotate.show{display:flex;}
  .phoneIcon{width:76px;height:132px;border:3px solid #7fffd4;border-radius:12px;
    position:relative;animation:phoneRot 2.2s cubic-bezier(.6,0,.3,1) infinite;}
  .phoneIcon::before{content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:22px;height:3px;border-radius:2px;background:#7fffd4;opacity:.6;}
  .phoneIcon::after{content:'';position:absolute;bottom:7px;left:50%;transform:translateX(-50%);
    width:26px;height:26px;border-radius:50%;border:2px solid #7fffd4;opacity:.5;}
  @keyframes phoneRot{0%,14%{transform:rotate(0);}46%,62%{transform:rotate(-90deg);}
    94%,100%{transform:rotate(0);}}
  .rotateTxt{font-size:19px;font-weight:bold;letter-spacing:5px;color:#7fffd4;}
  .rotateSub{font-size:11px;letter-spacing:3px;color:rgba(127,255,212,.45);margin-top:-14px;}
  #boot{position:fixed;inset:0;z-index:250;background:#000;display:none;
    align-items:center;justify-content:center;overflow:hidden;transition:opacity .45s ease;}
  #boot.show{display:flex;} #boot.fade{opacity:0;}
  #bootText{position:relative;z-index:2;font-family:"Songti SC","STSong","SimSun",serif;
    font-size:clamp(42px,13vw,96px);font-weight:bold;letter-spacing:.22em;
    text-indent:.22em;color:#fff;opacity:0;
    text-shadow:0 0 14px #ffd166,0 0 44px #ff9d00,0 0 90px rgba(255,120,0,.8);}
  #bootText.on{animation:bootText 1.5s cubic-bezier(.16,.9,.24,1) both;}
  @keyframes bootText{0%{opacity:0;transform:scale(.55);filter:blur(26px);}
    55%{opacity:1;transform:scale(1.05);filter:blur(0);}
    100%{opacity:1;transform:scale(1);filter:blur(0);}}
  #bootFlash{position:absolute;z-index:3;width:20vmax;height:20vmax;border-radius:50%;
    opacity:0;pointer-events:none;
    background:radial-gradient(circle,#fff 0%,#fff 38%,
      rgba(255,255,255,.85) 55%,rgba(255,255,255,0) 72%);}
  #bootFlash.go{animation:bootFlash .85s cubic-bezier(.5,0,.85,.4) both;}
  @keyframes bootFlash{0%{opacity:0;transform:scale(0);}22%{opacity:1;}
    100%{opacity:1;transform:scale(7);}}
  #bootRing{position:absolute;z-index:1;width:16vmax;height:16vmax;border-radius:50%;
    border:2px solid rgba(255,209,102,.55);opacity:0;}
  #bootRing.go{animation:bootRing 1s ease-out both;}
  @keyframes bootRing{0%{opacity:.85;transform:scale(.2);border-width:6px;}
    100%{opacity:0;transform:scale(2.4);border-width:1px;}}
  #over{position:fixed;inset:0;z-index:110;display:none;flex-direction:column;
    align-items:center;justify-content:center;
    background:radial-gradient(circle,rgba(0,20,30,.95),rgba(0,0,0,.98));
    text-align:center;padding:20px;}
  #over.show{display:flex;}
  #over h1{color:#ff4d6d;font-size:clamp(38px,10vw,58px);margin:0;letter-spacing:8px;
    text-shadow:0 0 20px #f06;animation:pulse 1.5s infinite;}
  @keyframes pulse{50%{opacity:.72;}}
  #over p{font-size:14px;margin:16px 0;letter-spacing:2px;line-height:1.9;}
  #over b{color:#7fffd4;}
  #over button{margin-top:10px;padding:14px 40px;font-size:16px;font-weight:bold;
    letter-spacing:4px;font-family:inherit;color:#0ff;cursor:pointer;
    background:transparent;border:2px solid #0ff;border-radius:4px;min-height:52px;}
  #over button:active{background:#0ff;color:#022;}
  #levelup{position:fixed;inset:0;z-index:105;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(circle,rgba(0,20,30,.94),rgba(0,0,0,.97));
    padding:20px;}
  #levelup.show{display:flex;}
  #luTitle{font-size:clamp(18px,4.5vw,26px);font-weight:bold;letter-spacing:6px;
    color:#ffd166;text-shadow:0 0 16px #ff9d00;}
  #luSub{font-size:11px;letter-spacing:4px;color:rgba(127,255,212,.5);margin-top:-8px;}
  #cards{display:flex;gap:10px;padding:0 4px;flex-wrap:wrap;
    justify-content:center;max-width:100%;}
  .card{width:clamp(110px,22vw,150px);padding:12px 10px;border:2px solid;
    border-radius:10px;background:rgba(0,26,36,.8);cursor:pointer;
    text-align:center;position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;min-height:150px;}
  .card:active{transform:scale(.94);}
  .card .ci{font-size:22px;line-height:1;margin-bottom:7px;font-weight:bold;}
  .card .cn{font-size:12px;font-weight:bold;letter-spacing:1px;
    margin-bottom:7px;line-height:1.2;}
  .card .cd{font-size:10px;line-height:1.55;opacity:.85;color:#cde;}
  .card .cs{position:absolute;bottom:4px;right:7px;font-size:9px;opacity:.45;}
  .card.epic::after{content:'E';position:absolute;top:5px;right:7px;
    font-size:9px;color:#c77dff;font-weight:bold;}
  .card.legend::after{content:'L';position:absolute;top:5px;right:7px;
    font-size:11px;color:#ffd166;font-weight:bold;}
  .card.curse{border-style:dashed;background:rgba(30,0,10,.8);}
  .card.curse::after{content:'C';position:absolute;top:5px;right:7px;
    font-size:11px;color:#ff4d6d;font-weight:bold;}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);
    background:rgba(0,26,36,.96);color:#ffd166;padding:10px 22px;border-radius:8px;
    font-size:13px;font-weight:bold;letter-spacing:2px;z-index:180;
    pointer-events:none;box-shadow:0 0 20px rgba(255,209,102,.5);
    border:1px solid #ffd166;max-width:80vw;text-align:center;}
  .saveItem{display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;margin-bottom:8px;border-radius:8px;
    background:rgba(0,26,36,.7);border:1px solid rgba(127,255,212,.2);gap:8px;}
  .saveItem .sl{font-size:12px;color:#7fffd4;flex:1;min-width:0;}
  .saveItem .sl b{color:#ffd166;font-size:14px;}
  .saveItem .sl small{display:block;color:rgba(127,255,212,.5);font-size:10px;
    margin-top:2px;letter-spacing:1px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;}
  .saveItem button{padding:8px 14px;font-size:11px;font-weight:bold;
    letter-spacing:1px;font-family:inherit;cursor:pointer;border-radius:5px;
    background:transparent;border:1.5px solid;min-height:36px;flex:0 0 auto;}
  .saveItem button:active{transform:scale(.95);}
  .saveItem button.blue{color:#4dd2ff;border-color:#4dd2ff;}
  .saveItem button.green{color:#5aff9d;border-color:#5aff9d;}
  .saveItem button.red{color:#ff4d6d;border-color:#ff4d6d;}
  .saveItem button.gold{color:#ffd166;border-color:#ffd166;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="admBtn" title="管理员命令行">CMD</button>
<div id="adm">
  <div id="admHead">
    <div id="admTitle">ADMIN CONSOLE</div>
    <div id="admHint">/help 查看命令</div>
    <button id="admClose">ESC</button>
  </div>
  <div id="admLog"></div>
  <div id="admInputWrap">
    <span id="admPrompt">seagull&gt;</span>
    <input id="admInput" autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="输入命令，如 /give coins 1000">
  </div>
</div>
<div id="admAutocomplete"></div>
<div id="skills" class="hide">
  <button class="skill" id="bBomb">
    <svg class="ring" viewBox="0 0 100 100">
      <circle class="ringBg" cx="50" cy="50" r="46"/>
      <circle class="ringFg" cx="50" cy="50" r="46"/>
    </svg>
    <svg class="ico" viewBox="0 0 24 24">
      <circle cx="10.5" cy="14.5" r="6"/>
      <path d="M15 9.5l2.2-2.2M17.4 6.4l-.6 1.8M17.4 6.4l1.8-.6"/>
    </svg>
    <span class="lbl">炸弹</span>
  </button>
  <button class="skill" id="bDash">
    <svg class="ring" viewBox="0 0 100 100">
      <circle class="ringBg" cx="50" cy="50" r="46"/>
      <circle class="ringFg" cx="50" cy="50" r="46"/>
    </svg>
    <svg class="ico" viewBox="0 0 24 24">
      <path d="M3 6.5h7M3 12h10M3 17.5h7"/>
      <path d="M15 8.5l4 3.5-4 3.5"/>
    </svg>
    <span class="lbl">冲刺</span>
  </button>
</div>
<div id="start">
  <div class="logo">SEAGULL<span>DOGFIGHT</span></div>
  <div id="coinBar">金币 <span id="coinAmt">0</span></div>
  <div id="startBtns">
    <button data-k="continue" id="btnContinue" style="display:none">继 续</button>
    <button data-k="play">开 始</button>

<script>
'use strict';
/* ============================================================
   SEAGULL DOGFIGHT v19 — 性能与特效重写
   ============================================================ */
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;};

const c=document.getElementById('c'), g=c.getContext('2d',{alpha:false});
let W=0, H=0;

/* ============================================================
   存档
   ============================================================ */
const META_KEY='sd_meta_v9';
const RUN_KEY='sd_run_v9';
const BAK_KEY='sd_bak_v9';
const VER=19;
const SAVE={
  coins:800,owned:{},
  equipped:{weapon:null,armor:null,engine:null,core:null,acc1:null,acc2:null},
  pity:0,best:0,
};
function loadMeta(){
  try{
    const raw=localStorage.getItem(META_KEY);
    if(!raw) return;
    const s=JSON.parse(raw);
    if(!s||typeof s!=='object') return;
    if(typeof s.coins==='number') SAVE.coins=s.coins;
    if(s.owned && typeof s.owned==='object') SAVE.owned=s.owned;
    if(s.equipped && typeof s.equipped==='object'){
      for(const k of ['weapon','armor','engine','core','acc1','acc2'])
        SAVE.equipped[k]=s.equipped[k]||null;
    }
    if(typeof s.pity==='number') SAVE.pity=s.pity;
    if(typeof s.best==='number') SAVE.best=s.best;
  }catch(e){}
}
function saveMeta(){
  try{
    localStorage.setItem(META_KEY, JSON.stringify({
      v:VER,ts:Date.now(),coins:SAVE.coins,owned:SAVE.owned,
      equipped:SAVE.equipped,pity:SAVE.pity,best:SAVE.best,
    }));
  }catch(e){}
}
function backupMeta(){
  try{
    localStorage.setItem(BAK_KEY, JSON.stringify({
      v:VER,ts:Date.now(),coins:SAVE.coins,owned:SAVE.owned,
      equipped:SAVE.equipped,pity:SAVE.pity,best:SAVE.best,
    }));
  }catch(e){}
}
function hasBackup(){
  try{
    const raw=localStorage.getItem(BAK_KEY);
    if(!raw) return null;
    const b=JSON.parse(raw);
    return (b&&b.v===VER)?b:null;
  }catch(_){ return null; }
}
function restoreBackup(){
  const b=hasBackup(); if(!b) return false;
  SAVE.coins=b.coins; SAVE.owned=b.owned||{};
  SAVE.equipped=b.equipped||{weapon:null,armor:null,engine:null,core:null,acc1:null,acc2:null};
  SAVE.pity=b.pity||0; SAVE.best=b.best||0;
  saveMeta(); refreshCoins(); return true;
}
function hasRun(){
  try{
    const raw=localStorage.getItem(RUN_KEY);
    if(!raw) return null;
    const r=JSON.parse(raw);
    if(!r||r.v!==VER||!r.alive||r.wave<1) return null;
    return r;
  }catch(_){ return null; }
}
function saveRun(){
  if(phase!=='play' && phase!=='levelup') return;
  if(!alive || !player) return;
  try{
    localStorage.setItem(RUN_KEY, JSON.stringify({
      v:VER,ts:Date.now(),
      wave,level,xp,xpNeed,score,
      player:{x:player.x,y:player.y,hp:player.hp,maxHp:player.maxHp,
        shield:player.shield,weapon:player.weapon,bomb:player.bomb,
        dashCd:player.dashCd,dashCdMax:player.dashCdMax},
      stats:JSON.parse(JSON.stringify(stats)),
      stats2:JSON.parse(JSON.stringify(stats2)),
      buffs:buffs.map(b=>({id:b.id,t:b.t,maxT:b.maxT})),
      curses:activeCurses.map(ac=>({id:ac.id,prog:ac.prog})),
      slowTimer,runCoins,alive:true,
    }));
  }catch(e){}
}
function loadRun(){
  const r=hasRun(); if(!r) return false;
  try{
    resetStats();
    Object.assign(stats, r.stats||{});
    if(!stats.evolution) stats.evolution={};
    if(!stats.taken) stats.taken={};
    player={
      x:clamp(r.player.x,22,W-22),y:clamp(r.player.y,22,H-22),
      vx:0,vy:0,r:CFG.player.r,
      maxHp:r.player.maxHp,hp:r.player.hp,cd:0,invuln:60,
      dashCd:r.player.dashCd||0,dashCdMax:r.player.dashCdMax||CFG.player.dashCd,
      dashT:0,dashVx:0,dashVy:0,dashBuffT:0,
      weapon:r.player.weapon||0,bomb:r.player.bomb||1,shield:r.player.shield||0,
      thr:0,muzzle:0,tilt:0,shotCount:0,chargeT:0,shieldGlow:0,
    };
    bullets=[]; ebullets=[]; enemies=[]; drops=[];
    FX.reset();
    buffs=[];
    for(const b of (r.buffs||[])){
      if(!BUFF_DEFS[b.id]) continue;
      buffs.push({id:b.id,t:b.t||600,maxT:b.maxT||600,pulse:0});
    }
    recomputeBuffs();
    activeCurses=[];
    for(const cur of (r.curses||[])){
      const def=CURSES.find(x=>x.id===cur.id);
      if(!def) continue;
      activeCurses.push({id:cur.id,ref:def,prog:cur.prog||0,done:false,
        maxProg:def.need,pulse:0});
    }
    wave=r.wave; level=r.level; xp=r.xp; xpNeed=r.xpNeed;
    score=r.score; pendingLevels=0;
    runCoins=r.runCoins||0;
    stats2=Object.assign({kills:0,dashes:0,lowkills:0,critkills:0,
      maxCombo:0,nobombwins:0,pickups:0,maxbuffs:0,waves:0}, r.stats2||{});
    slowTimer=r.slowTimer||0; slowFlash=0;
    combo=0; comboTimer=0;
    waveCleared=false; waveTimer=80;
    alive=true;
    hitStop=0; shake=0; flash=0; bombFlash=0; impactWhite=0; aber=0;
    banner=CFG.waves.bannerTime; bannerText='已恢复 · WAVE '+wave;
    JOY.active=false; JOY.dx=0; JOY.dy=0;
    return true;
  }catch(e){ return false; }
}
function clearRun(){ try{ localStorage.removeItem(RUN_KEY); }catch(_){} }

/* ============================================================
   装备库
   ============================================================ */
const RARITIES=[
  {id:'common',n:'普通',c:'#aabbcc',w:50,mult:1.0,p:'C'},
  {id:'rare',  n:'稀有',c:'#4dd2ff',w:30,mult:1.7,p:'R'},
  {id:'epic',  n:'史诗',c:'#c77dff',w:15,mult:2.7,p:'E'},
  {id:'legend',n:'传说',c:'#ffd166',w:4, mult:4.2,p:'L'},
  {id:'mythic',n:'神话',c:'#ff3366',w:1, mult:6.5,p:'M'},
];
const RAR_MAP={}; RARITIES.forEach(r=>RAR_MAP[r.id]=r);
const ATTR_DEFS={
  dmg:{n:'破军',t:'伤害',v:8,f:(v,s)=>{s.dmgMul*=1+v/100;}},
  rate:{n:'疾弦',t:'射速',v:7,f:(v,s)=>{s.fireRate*=1+v/100;}},
  crit:{n:'裂空',t:'暴击',v:6,f:(v,s)=>{s.critChance+=v/100;}},
  critMul:{n:'处刑',t:'暴伤',v:14,f:(v,s)=>{s.critMul+=v/100;}},
  pierce:{n:'贯穿',t:'穿透',v:4,f:(v,s)=>{s.pierceBonus+=Math.max(1,Math.round(v/8));}},
  maxHp:{n:'壁垒',t:'生命',v:20,f:(v,s,p)=>{p.maxHp+=Math.round(v);}},
  resist:{n:'坚忍',t:'减伤',v:6,f:(v,s)=>{s.loadoutResist*=(1-Math.min(.7,v/100));}},
  regen:{n:'复苏',t:'回血',v:.6,f:(v,s)=>{s.loadoutRegen+=v;}},
  speed:{n:'迅捷',t:'移速',v:8,f:(v,s)=>{s.speedMul*=1+v/100;}},
  dashCd:{n:'相位',t:'冲刺CD',v:8,f:(v,s)=>{s.dashCdMul*=Math.max(.3,1-v/100);}},
  dashPower:{n:'突进',t:'冲刺力',v:12,f:(v,s)=>{s.dashPowerMul*=1+v/100;}},
  magnet:{n:'磁力',t:'吸附',v:30,f:(v,s)=>{s.magnetR+=v;}},
  lifesteal:{n:'吸血',t:'击杀回',v:1.2,f:(v,s)=>{s.lifesteal+=v;}},
  luck:{n:'福泽',t:'掉落',v:10,f:(v,s)=>{s.luckMul*=1+v/100;}},
  combo:{n:'连锁',t:'连击窗',v:10,f:(v,s)=>{s.comboWindowMul*=1+v/100;}},
  xpGain:{n:'悟道',t:'经验',v:12,f:(v,s)=>{s.xpMul*=1+v/100;}},
  coinGain:{n:'财源',t:'金币',v:15,f:(v,s)=>{s.coinMul*=1+v/100;}},
  revive:{n:'复生',t:'复活',v:1,f:(v,s)=>{s.revive=(s.revive||0)+1;}},
};
const SLOT_DEFS=[
  {id:'weapon',n:'武器',icon:'W',pre:['烈焰','寒霜','雷霆','暗影','炽阳','混沌','虚空','钢锋'],
    attrs:['dmg','rate','crit','critMul','pierce','lifesteal','luck','combo']},
  {id:'armor',n:'装甲',icon:'A',pre:['钢铁','磐石','荆棘','守护','不朽','永夜','厚土','铁壁'],
    attrs:['maxHp','resist','regen','dmg','combo','luck','xpGain','coinGain']},
  {id:'engine',n:'引擎',icon:'E',pre:['疾风','幻影','流星','瞬动','超载','游隼','破浪','幽影'],
    attrs:['speed','dashCd','dashPower','magnet','crit','dmg','combo','coinGain']},
  {id:'core',n:'核心',icon:'C',pre:['炽核','苍核','玄核','赤核','秘核','星核','暗核','灵核'],
    attrs:['luck','combo','xpGain','coinGain','lifesteal','dmg','rate','crit']},
  {id:'accessory',n:'配饰',icon:'X',pre:['星辰','月光','日曜','深渊','天启','残夜','苍穹','永恒'],
    attrs:['dmg','rate','maxHp','speed','crit','pierce','lifesteal','luck']},
];
const MYTHIC_ACCESSORIES=[
  {id:'savior_grace',n:'救世主的加护',slot:'accessory',rarity:'mythic',icon:'H',c:'#ffd166',
    d:'每局复活 1 次（HP 100% 复生）\n全属性 +35%',
    apply:(s)=>{s.revive=(s.revive||0)+1;s.dmgMul*=1.35;s.fireRate*=1.35;
      s.speedMul*=1.35;s.critChance+=.15;s.luckMul*=1.35;s.comboWindowMul*=1.35;}},
  {id:'end_ring',n:'终末指环',slot:'accessory',rarity:'mythic',icon:'O',c:'#ff3366',
    d:'击杀 BOSS 全场扣 30% 最大生命\n每击杀 +1 层（最高 30），每层伤害 +3%',
    apply:(s)=>{s.endRing=true;s.endRingStacks=0;}},
];
const ALL_ITEMS=[]; const ITEM_MAP={}; let uid=0;
for(const slot of SLOT_DEFS){
  for(const attr of slot.attrs){
    for(const rar of RARITIES){
      const ad=ATTR_DEFS[attr];
      const val=+(ad.v*rar.mult).toFixed(2);
      const pre=slot.pre[uid % slot.pre.length];
      const id=`i_${slot.id}_${attr}_${rar.id}_${uid++}`;
      ALL_ITEMS.push({id,slot:slot.id,attr,rarity:rar.id,val,
        n:`${pre}·${ad.n}`,icon:slot.icon,c:rar.c,
        d:`${ad.t} +${['resist','dashCd'].includes(attr)?val.toFixed(1)+'%'
          :['pierce','revive'].includes(attr)?Math.max(1,Math.round(val/8))+' 层'
          :['regen','lifesteal'].includes(attr)?val.toFixed(1)
          :Math.round(val)+'%'}`,
        apply:(s,p)=>ad.f(val,s,p)});
    }
  }
}
for(const m of MYTHIC_ACCESSORIES) ALL_ITEMS.push(m);
ALL_ITEMS.forEach(i=>ITEM_MAP[i.id]=i);
const TOTAL_ITEMS=ALL_ITEMS.length;

/* ============================================================
   抽奖
   ============================================================ */
const COST_ONE=100, COST_TEN=900, PITY=10;
function pickRarity(){
  if(SAVE.pity>=PITY-1){ SAVE.pity=0; return Math.random()<0.25?'legend':'epic'; }
  const total=RARITIES.reduce((a,b)=>a+b.w,0);
  let r=Math.random()*total;
  for(const rar of RARITIES){
    if(r<rar.w){
      if(rar.id==='legend'||rar.id==='mythic') SAVE.pity=0; else SAVE.pity++;
      return rar.id;
    }
    r-=rar.w;
  }
  SAVE.pity++; return 'common';
}
function drawOnce(){
  const rar=pickRarity();
  if(rar==='mythic'){
    const ms=MYTHIC_ACCESSORIES.filter(m=>!SAVE.owned[m.id]);
    if(ms.length && Math.random()<0.7) return ms[Math.floor(Math.random()*ms.length)];
  }
  const pool=ALL_ITEMS.filter(it=>it.rarity===rar);
  return pool[Math.floor(Math.random()*pool.length)];
}
function doGacha(n,silent){
  const cost=n===1?COST_ONE:COST_TEN;
  if(!silent && SAVE.coins<cost){ showToast('金币不足'); return []; }
  if(!silent) SAVE.coins-=cost;
  const results=[];
  for(let i=0;i<n;i++){
    const item=drawOnce();
    SAVE.owned[item.id]=(SAVE.owned[item.id]||0)+1;
    results.push(item);
  }
  saveMeta(); backupMeta(); refreshCoins();
  if(!silent) renderGachaResults(results);
  return results;
}
function renderGachaResults(items){
  const grid=document.getElementById('gachaGrid'); grid.innerHTML='';
  items.forEach((it)=>{
    const el=document.createElement('div'); el.className='gitem';
    el.style.borderColor=it.c; el.style.color=it.c;
    el.style.boxShadow=`0 0 12px ${it.c}55`;
    const rar=RAR_MAP[it.rarity];
    el.innerHTML=`<div class="gi">${it.icon}</div>
      <div class="gn">${it.n}</div>
      <div class="gs">${rar.p} · ${it.d}</div>`;
    grid.appendChild(el);
  });
  if(items.some(i=>['legend','mythic'].includes(i.rarity))) showToast('稀有出货');
}
function showToast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1400);
}
function refreshCoins(){
  const el=document.getElementById('coinAmt');
  const el2=document.getElementById('gachaCoinAmt');
  if(el) el.textContent=SAVE.coins.toLocaleString();
  if(el2) el2.textContent=SAVE.coins.toLocaleString();
}
function addCoins(n){ SAVE.coins=Math.max(0,(SAVE.coins+n)|0); saveMeta(); refreshCoins(); }

/* ============================================================
   装备 UI
   ============================================================ */
let currentSlotFilter=null;
let lastTapId=null, lastTapTime=0;
function renderEquip(){
  const slotsEl=document.getElementById('slots'); slotsEl.innerHTML='';
  const slotList=[
    {id:'weapon',n:'武器',icon:'W'},{id:'armor',n:'装甲',icon:'A'},
    {id:'engine',n:'引擎',icon:'E'},{id:'core',n:'核心',icon:'C'},
    {id:'acc1',n:'配饰1',icon:'X'},{id:'acc2',n:'配饰2',icon:'X'}];
  for(const s of slotList){
    const el=document.createElement('div'); el.className='slot';
    if(currentSlotFilter===s.id) el.classList.add('active');
    const itemId=SAVE.equipped[s.id]; const item=itemId?ITEM_MAP[itemId]:null;
    if(item){
      el.classList.add('filled'); el.style.borderColor=item.c;
      el.innerHTML=`<div class="si" style="color:${item.c}">${item.icon}</div>
        <div class="sl">${item.n}</div>`;
    } else {
      el.innerHTML=`<div class="si">${s.icon}</div><div class="sl">${s.n}</div>`;
    }
    el.addEventListener('pointerdown',ev=>{
      ev.preventDefault(); ev.stopPropagation();
      currentSlotFilter=currentSlotFilter===s.id?null:s.id;
      renderEquip();
    });
    slotsEl.appendChild(el);
  }
  const listEl=document.getElementById('itemList'); listEl.innerHTML='';
  const ownedIds=Object.keys(SAVE.owned).filter(id=>ITEM_MAP[id]);
  document.getElementById('collectCount').textContent=ownedIds.length;
  document.getElementById('collectTotal').textContent=TOTAL_ITEMS;
  let items=ownedIds.map(id=>ITEM_MAP[id]);
  if(currentSlotFilter){
    const want=currentSlotFilter.startsWith('acc')?'accessory':currentSlotFilter;
    items=items.filter(it=>it.slot===want);
  }
  const order=['mythic','legend','epic','rare','common'];
  items.sort((a,b)=>order.indexOf(a.rarity)-order.indexOf(b.rarity));
  const label=document.getElementById('listLabel');
  if(currentSlotFilter){
    const sdef=slotList.find(x=>x.id===currentSlotFilter);
    label.textContent=`筛选：${sdef.n} · ${items.length} 件（点槽位取消）`;
  } else {
    label.textContent=`全部装备 · ${items.length} 件（点槽位筛选）`;
  }
  if(!items.length){
    listEl.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px 20px;
      color:rgba(127,255,212,.6);font-size:13px;letter-spacing:2px">
      ${currentSlotFilter?'此分类暂无装备':'还没有装备，去抽奖试试'}</div>`;
    return;
  }
  const equippedIds=Object.values(SAVE.equipped).filter(Boolean);
  for(const it of items){
    const el=document.createElement('div'); el.className='iitem';
    el.style.borderColor=it.c; el.style.color=it.c;
    const isEq=equippedIds.includes(it.id);
    if(isEq) el.classList.add('eq');
    el.innerHTML=`${isEq?'<div class="eq-mark">E</div>':''}
      <div class="ii">${it.icon}</div>
      <div class="in">${it.n}</div>
      <div class="iv">${it.d}</div>`;
    el.addEventListener('pointerdown', ev=>{
      ev.preventDefault(); ev.stopPropagation();
      const now=Date.now();
      if(lastTapId===it.id && now-lastTapTime<350){
        showDetail(it); lastTapId=null; lastTapTime=0;
      } else {
        lastTapId=it.id; lastTapTime=now;
        equipItem(it.id);
      }
    });
    listEl.appendChild(el);
  }
}
function showDetail(item){
  const d=document.getElementById('detail');
  d.style.borderColor=item.c; d.style.color=item.c;
  d.querySelector('.di').textContent=item.icon;
  d.querySelector('.di').style.color=item.c;
  d.querySelector('.dn').textContent=item.n;
  d.querySelector('.dn').style.color=item.c;
  d.querySelector('.dr').textContent=RAR_MAP[item.rarity].n;
  d.querySelector('.dr').style.color=item.c;
  d.querySelector('.dd').textContent=item.d;
  const eqBtn=d.querySelector('.de');
  const isEq=Object.values(SAVE.equipped).includes(item.id);
  eqBtn.textContent=isEq?'卸 下':'装 备';
  eqBtn.style.color=item.c;
  d.dataset.itemId=item.id;
  d.classList.add('show');
}
function equipItem(itemId){

let AC=null, lastShootSfx=0;
function initAudio(){
  if(AC) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume(); }catch(_){}
}
function beep(f,d,ty='square',v=.04,st){
  if(!AC) return;
  const o=AC.createOscillator(), gn=AC.createGain();
  o.type=ty; o.frequency.setValueAtTime(f,AC.currentTime);
  if(st) o.frequency.exponentialRampToValueAtTime(st,AC.currentTime+d);
  gn.gain.setValueAtTime(v,AC.currentTime);
  gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(gn).connect(AC.destination); o.start(); o.stop(AC.currentTime+d);
}
function noise(d,v=.06){
  if(!AC) return;
  const n=Math.floor(AC.sampleRate*d); const b=AC.createBuffer(1,n,AC.sampleRate);
  const a=b.getChannelData(0);
  for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=b;
  const gn=AC.createGain(); gn.gain.value=v;
  s.connect(gn).connect(AC.destination); s.start();
}

  JOY.ox=e.clientX; JOY.oy=e.clientY;

  if(!JOY.active||e.pointerId!==JOY.id) return;
  let dx=e.clientX-JOY.ox, dy=e.clientY-JOY.oy;
  const d=Math.hypot(dx,dy);
  if(d>JOY.R){ dx=dx/d*JOY.R; dy=dy/d*JOY.R; }
  JOY.kx=JOY.ox+dx; JOY.ky=JOY.oy+dy;
  JOY.dx=dx/JOY.R; JOY.dy=dy/JOY.R;
}

let starLayer=null, starOff=0, gridOffset=0;
function buildStars(){
  if(W<=0||H<=0) return;
  const oc=document.createElement('canvas');
  oc.width=W; oc.height=H*2;
  const og=oc.getContext('2d'); const H2=H*2;
  og.clearRect(0,0,W,H2);
  for(let i=0;i<240;i++){
    const layer=i<130?0:i<200?1:2;
    const x=Math.random()*W, y=Math.random()*H2;
    const r=layer===0?.5:layer===1?1.0:1.7;
    const a=.2+Math.random()*.7;
    og.globalAlpha=a;
    og.fillStyle=layer===2?'#dff':layer===1?'#8cf':'#456';
    og.fillRect(x,y,r,r);
  }
  for(let i=0;i<5;i++){
    const cx=Math.random()*W, cy=Math.random()*H2;
    const rr=80+Math.random()*160;
    const cg=og.createRadialGradient(cx,cy,0,cx,cy,rr);
    cg.addColorStop(0,Math.random()<.5?'rgba(0,150,255,.09)':'rgba(120,0,255,.07)');
    cg.addColorStop(1,'rgba(0,0,0,0)');
    og.globalAlpha=1;
    og.fillStyle=cg;
    og.fillRect(cx-rr,cy-rr,rr*2,rr*2);
  }
  og.globalAlpha=1;
  starLayer=oc; starOff=0;
}
function drawStars(dt=1){
  if(!starLayer) return;
  starOff += 1.0*dt;
  if(starOff>=H) starOff-=H;
  const oy=-starOff;
  g.drawImage(starLayer,0,oy,W,H);
  g.drawImage(starLayer,0,oy+H,W,H);
  gridOffset=(gridOffset+0.35*dt)%70;
  g.strokeStyle='rgba(0,200,255,.04)';
  g.lineWidth=1;
  g.beginPath();
  for(let x=0;x<W+70;x+=70){
    g.moveTo(x,0); g.lineTo(x,H);
  }
  for(let y=-gridOffset;y<H+70;y+=70){
    g.moveTo(0,y); g.lineTo(W,y);
  }
  g.stroke();
}

/* ============================================================
   预渲染纹理 — 关键性能优化
   缓存每种颜色的 glow / dot / ring 贴图，避免每帧 createGradient
   ============================================================ */
const TexCache = {
  glows: new Map(),
  dots: new Map(),
  glowSize: 64,
  dotSize: 16,

  getGlow(color){
    let t=this.glows.get(color);
    if(t) return t;
    const size=this.glowSize;
    const cv=document.createElement('canvas');
    cv.width=cv.height=size*2;
    const ctx=cv.getContext('2d');
    const cg=ctx.createRadialGradient(size,size,0,size,size,size);
    cg.addColorStop(0,'#fff');
    cg.addColorStop(.25,color);
    cg.addColorStop(.7,this.hexA(color,.35));
    cg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=cg;
    ctx.beginPath(); ctx.arc(size,size,size,0,TAU); ctx.fill();
    this.glows.set(color,cv);
    return cv;
  },

  getDot(color){
    let t=this.dots.get(color);
    if(t) return t;
    const size=this.dotSize;
    const cv=document.createElement('canvas');
    cv.width=cv.height=size*2;
    const ctx=cv.getContext('2d');
    ctx.shadowColor=color; ctx.shadowBlur=size*.6;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(size,size,size*.55,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.arc(size,size,size*.85,0,TAU); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(size,size,size*.45,0,TAU); ctx.fill();
    this.dots.set(color,cv);
    return cv;
  },

  hexA(hex,a){
    if(hex[0]!=='#') return hex;
    let h=hex.slice(1);
    if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    const r=parseInt(h.slice(0,2),16);
    const g=parseInt(h.slice(2,4),16);
    const b=parseInt(h.slice(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  },
};

/* ============================================================
   新 FX 系统 — 8 种形状，全对象池

const FX = {
  particles: [],
  shards: [],
  sparks: [],
  bolts: [],
  beams: [],
  rings: [],
  flashes: [],
  texts: [],

  reset(){
    this.particles.length=0;
    this.shards.length=0;
    this.sparks.length=0;
    this.bolts.length=0;
    this.beams.length=0;
    this.rings.length=0;
    this.flashes.length=0;
    this.texts.length=0;
  },

  /* --- 生成：通用粒子（dot / smoke / glow） --- */
  particle(x,y,vx,vy,life,r,color,shape='dot'){
    const cap=CFG.caps.particles;
    if(this.particles.length>=cap) return;
    this.particles.push({x,y,vx,vy,life,max:life,r,color,shape});
  },
  dot(x,y,vx,vy,life,r,color){
    this.particle(x,y,vx,vy,life,r,color,'dot');
  },
  smoke(x,y,vx,vy,life,r,color){
    this.particle(x,y,vx,vy,life,r,color,'smoke');
  },
  glow(x,y,life,r,color){
    this.particle(x,y,0,0,life,r,color,'glow');
  },

  /* --- 火花线：线段粒子 --- */
  spark(x,y,vx,vy,life,len,color){
    const cap=CFG.caps.sparks;
    if(this.sparks.length>=cap) return;
    this.sparks.push({x,y,vx,vy,life,max:life,len,color});
  },
  sparkBurst(x,y,color,n,speed=9,len=8){
    for(let i=0;i<n;i++){
      const a=rnd(0,TAU), s=rnd(speed*.4,speed);
      this.spark(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(10,24),len,color);
    }
  },

  /* --- 碎片：多边形 --- */
  shard(x,y,vx,vy,life,size,color,sides){
    const cap=CFG.caps.shards;
    if(this.shards.length>=cap) return;
    this.shards.push({x,y,vx,vy,rot:rnd(0,TAU),vrot:rnd(-.4,.4),
      life,max:life,size,color,sides:sides||Math.floor(rnd(3,6))});
  },
  shardBurst(x,y,color,n,speedMul=1){
    for(let i=0;i<n;i++){
      const a=rnd(0,TAU), s=rnd(2.5,7)*speedMul;
      this.shard(x,y,Math.cos(a)*s,Math.sin(a)*s,
        rnd(24,55),rnd(4,11),color);
    }
  },

  /* --- 闪电：折线 --- */
  bolt(x1,y1,x2,y2,life,color){
    const cap=CFG.caps.bolts;
    if(this.bolts.length>=cap) return;
    const pts=[];
    const segs=6;
    for(let i=0;i<=segs;i++){
      const t=i/segs;
      const nx=x1+(x2-x1)*t;
      const ny=y1+(y2-y1)*t;
      const jx=(i===0||i===segs)?0:rnd(-14,14);
      const jy=(i===0||i===segs)?0:rnd(-14,14);
      pts.push({x:nx+jx,y:ny+jy});
    }
    this.bolts.push({pts,life,max:life,color});
  },

  /* --- 光柱：朝向射线 --- */
  beam(x,y,ang,width,len,life,color){
    const cap=CFG.caps.beams;
    if(this.beams.length>=cap) return;
    this.beams.push({x,y,ang,w:width,len,life,max:life,color});
  },

  /* --- 波纹环 --- */
  ring(x,y,maxR,lw,color,delay=0){
    const cap=CFG.caps.rings;
    if(this.rings.length>=cap) this.rings.shift();
    this.rings.push({x,y,r:4,maxR,life:1,max:1,lw,color,delay});
  },

  /* --- 星芒闪光：中心放射线条 --- */
  flash(x,y,color,rays=8,radius=48,life=18,rot=0){
    const cap=CFG.caps.flashes;
    if(this.flashes.length>=cap) this.flashes.shift();
    this.flashes.push({x,y,color,rays,radius,life,max:life,rot});
  },

  /* --- 文字 --- */
  text(x,y,text,color,size=16,crit=false){
    const cap=CFG.caps.texts;
    if(this.texts.length>=cap) this.texts.shift();
    this.texts.push({x,y,vy:-1.1,life:52,max:52,text,color,size,crit});
  },

  /* --- 预设组合 --- */
  hit(x,y,color,power){
    const n = 4 + Math.floor(power*4);
    this.sparkBurst(x,y,color,n,8+power*4,6);
    this.flash(x,y,'#fff',6,24+power*20,12);
    if(power>=1){
      this.ring(x,y,60+power*40,2.4,'#fff');
    }
  },
  crit(x,y,color){
    this.sparkBurst(x,y,color,16,14,9);
    this.flash(x,y,color,8,60,20);
    this.flash(x,y,'#fff',6,40,14,Math.PI/8);
    this.ring(x,y,90,3,'#fff');
    this.shardBurst(x,y,color,6,1.2);
  },
  explosion(x,y,color,power=1){
    this.glow(x,y,26,60*power,color);
    this.glow(x,y,18,32*power,'#fff');
    this.sparkBurst(x,y,color,Math.floor(14+power*16),12+power*6,7);
    this.shardBurst(x,y,color,Math.floor(6+power*10),1.2);
    this.smoke(x,y,rnd(-1,1),rnd(-1,-.3),rnd(35,50),rnd(10,16),'rgba(80,80,80,.45)');
    this.ring(x,y,80*power,3,'#fff');
    this.ring(x,y,130*power,2,color,6);
  },
  levelUpBurst(x,y,color){
    this.glow(x,y,30,50,color);
    this.sparkBurst(x,y,color,22,12,7);
    this.flash(x,y,color,10,70,24);
    this.ring(x,y,90,2.5,color);
    this.ring(x,y,140,1.8,'#fff',8);
  },

  /* --- 更新 --- */
  update(dt, pvx=0, pvy=0){
    // 通用粒子
    const P=this.particles;
    for(let i=P.length-1;i>=0;i--){
      const p=P[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      const dr=Math.pow(.94,dt);
      p.vx*=dr; p.vy*=dr;
      p.vx+=pvx*.04*dt; p.vy+=pvy*.04*dt;
      p.life-=dt;
      if(p.life<=0){
        P[i]=P[P.length-1]; P.pop();
      }
    }
    // 碎片
    const S=this.shards;
    for(let i=S.length-1;i>=0;i--){
      const s=S[i];
      s.x+=s.vx*dt; s.y+=s.vy*dt;
      s.vx*=Math.pow(.96,dt);
      s.vy*=Math.pow(.96,dt);
      s.vy+=.06*dt;
      s.rot+=s.vrot*dt;
      s.life-=dt;
      if(s.life<=0){ S[i]=S[S.length-1]; S.pop(); }
    }
    // 火花
    const SP=this.sparks;
    for(let i=SP.length-1;i>=0;i--){
      const s=SP[i];
      s.x+=s.vx*dt; s.y+=s.vy*dt;
      const dr=Math.pow(.9,dt);
      s.vx*=dr; s.vy*=dr;
      s.life-=dt;
      if(s.life<=0){ SP[i]=SP[SP.length-1]; SP.pop(); }
    }
    // 闪电
    const B=this.bolts;
    for(let i=B.length-1;i>=0;i--){
      const b=B[i];
      b.life-=dt;
      if(b.life<=0){ B[i]=B[B.length-1]; B.pop(); }
    }
    // 光柱
    const BM=this.beams;
    for(let i=BM.length-1;i>=0;i--){
      const b=BM[i];
      b.life-=dt;
      if(b.life<=0){ BM[i]=BM[BM.length-1]; BM.pop(); }
    }
    // 波纹环
    const R=this.rings;
    for(let i=R.length-1;i>=0;i--){
      const r=R[i];
      if(r.delay>0){ r.delay-=dt; continue; }
      r.r += (r.maxR-r.r)*.18*dt;
      r.life -= .055*dt;
      if(r.life<=0){ R[i]=R[R.length-1]; R.pop(); }
    }
    // 闪光
    const F=this.flashes;
    for(let i=F.length-1;i>=0;i--){
      const f=F[i];
      f.life-=dt;
      if(f.life<=0){ F[i]=F[F.length-1]; F.pop(); }
    }
    // 文字
    const T=this.texts;
    for(let i=T.length-1;i>=0;i--){
      const t=T[i];
      t.y+=t.vy*dt;
      t.vy*=.94;
      t.life-=dt;
      if(t.life<=0){ T[i]=T[T.length-1]; T.pop(); }
    }
  },

  /* --- 渲染 --- */
  render(){
    // 光柱（最底）
    for(const b of this.beams){
      const a=b.life/b.max;
      g.globalAlpha=a*.7;
      g.save();
      g.translate(b.x,b.y);
      g.rotate(b.ang);
      const grd=g.createLinearGradient(0,0,b.len,0);
      grd.addColorStop(0,b.color);
      grd.addColorStop(.4,TexCache.hexA(b.color,.4));
      grd.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=grd;
      g.fillRect(0,-b.w/2,b.len,b.w);
      g.globalAlpha=a;
      g.fillStyle='#fff';
      g.fillRect(0,-b.w/6,b.len,b.w/3);
      g.restore();
    }
    g.globalAlpha=1;

    // 烟雾
    for(const p of this.particles){
      if(p.shape!=='smoke') continue;
      const a=p.life/p.max;
      g.globalAlpha=a*.4;
      g.fillStyle=p.color;
      g.beginPath(); g.arc(p.x,p.y,p.r,0,TAU); g.fill();
    }
    g.globalAlpha=1;

    // 粒子（dot / glow 用 drawImage 加速）
    for(const p of this.particles){
      const a=p.life/p.max;
      g.globalAlpha=a;
      if(p.shape==='glow'){
        const tex=TexCache.getGlow(p.color);
        const s=p.r*2;
        g.drawImage(tex,p.x-s/2,p.y-s/2,s,s);
      } else {
        const tex=TexCache.getDot(p.color);
        const s=p.r*3;
        g.drawImage(tex,p.x-s/2,p.y-s/2,s,s);
      }
    }
    g.globalAlpha=1;

    // 碎片
    for(const s of this.shards){
      const a=s.life/s.max;
      g.globalAlpha=a;
      g.save();
      g.translate(s.x,s.y); g.rotate(s.rot);
      g.fillStyle=s.color;
      g.beginPath();
      for(let i=0;i<s.sides;i++){
        const ang=i/s.sides*TAU;
        const px=Math.cos(ang)*s.size, py=Math.sin(ang)*s.size;
        i?g.lineTo(px,py):g.moveTo(px,py);
      }
      g.closePath(); g.fill();
      g.strokeStyle='rgba(255,255,255,'+(a*.6)+')';
      g.lineWidth=1;
      g.stroke();
      g.restore();
    }
    g.globalAlpha=1;

    // 火花线（一次路径批量）
    if(this.sparks.length){
      g.lineCap='round';
      g.lineWidth=1.6;
      let curColor=null;
      g.beginPath();
      for(const s of this.sparks){
        if(s.color!==curColor){
          if(curColor!==null){ g.stroke(); g.beginPath(); }
          g.strokeStyle=s.color;
          curColor=s.color;
        }
        const a=s.life/s.max;
        g.globalAlpha=a;
        const mag=Math.hypot(s.vx,s.vy)||1;
        const ux=s.vx/mag, uy=s.vy/mag;
        g.moveTo(s.x-ux*s.len, s.y-uy*s.len);
        g.lineTo(s.x+ux*s.len, s.y+uy*s.len);
      }
      g.stroke();
      g.globalAlpha=1;
    }

    // 闪电
    for(const b of this.bolts){
      const a=b.life/b.max;
      g.globalAlpha=a;
      g.strokeStyle=b.color;
      g.lineWidth=2.5;
      g.shadowColor=b.color; g.shadowBlur=14;
      g.beginPath();
      g.moveTo(b.pts[0].x,b.pts[0].y);
      for(let i=1;i<b.pts.length;i++) g.lineTo(b.pts[i].x,b.pts[i].y);
      g.stroke();
      g.strokeStyle='#fff'; g.lineWidth=1;
      g.stroke();
      g.shadowBlur=0;
    }
    g.globalAlpha=1;

    // 波纹环
    for(const r of this.rings){
      if(r.delay>0) continue;
      const a=r.life*.9;
      g.globalAlpha=a;
      g.strokeStyle=r.color;
      g.lineWidth=(r.lw||2.5)*r.life;
      g.beginPath(); g.arc(r.x,r.y,r.r,0,TAU); g.stroke();
    }
    g.globalAlpha=1;

    // 星芒闪光
    for(const f of this.flashes){
      const a=f.life/f.max;
      const scale=1+(1-a)*.8;
      g.globalAlpha=a;
      g.save();
      g.translate(f.x,f.y);
      g.rotate(f.rot);
      g.strokeStyle=f.color;
      g.lineWidth=2.5;
      g.beginPath();
      for(let i=0;i<f.rays;i++){
        const ang=i/f.rays*TAU;
        const r1=6;
        const r2=f.radius*scale;
        g.moveTo(Math.cos(ang)*r1, Math.sin(ang)*r1);
        g.lineTo(Math.cos(ang)*r2, Math.sin(ang)*r2);
      }
      g.stroke();
      // 中心光斑
      const tex=TexCache.getGlow(f.color);
      const s=f.radius*scale*.8;
      g.globalAlpha=a*.9;
      g.drawImage(tex,-s/2,-s/2,s,s);
      g.restore();
    }
    g.globalAlpha=1;

    // 文字
    for(const t of this.texts){
      const a=t.life/t.max;
      g.globalAlpha=a;
      const sc = t.crit ? 1+(1-a)*.5 : 1;
      g.save();
      g.translate(t.x,t.y);
      g.scale(sc,sc);
      g.fillStyle=t.color;
      g.font='bold '+t.size+'px Consolas';
      g.textAlign='center';
      g.fillText(t.text,0,0);
      g.restore();
    }
    g.globalAlpha=1;
    g.textAlign='left';
  },
};

const BUFF_DEFS={
  power:{n:'力量',i:'P',c:'#ff4d6d',dmg:1.6},
  resist:{n:'抗性',i:'R',c:'#5aff9d',resist:.55},
  regen:{n:'回复',i:'+',c:'#5aff9d',regen:2.4},
  vitality:{n:'生命',i:'V',c:'#ff8c42',maxHp:60},
  frenzy:{n:'狂暴',i:'F',c:'#ffd166',rate:1.8},
  swift:{n:'迅捷',i:'S',c:'#7fffd4',speed:1.55},
  phase:{n:'相位',i:'>',c:'#0ff',dashCd:.42},
  vamp:{n:'吸血',i:'L',c:'#c77dff',lifesteal:7},
  focus:{n:'专注',i:'O',c:'#ff9d00',combo:2.2},
  deadly:{n:'致命',i:'K',c:'#ff3366',crit:.4},
  pierce:{n:'穿甲',i:'=',c:'#c77dff',pierce:2},
  slow:{n:'时缓',i:'T',c:'#88e0ff',slow:1},
};
const BUFF_IDS=Object.keys(BUFF_DEFS);
let buffs=[];
let buffMul={dmg:1,rate:1,speed:1,resist:1,regen:0,crit:0,pierce:0,dashCd:1,combo:1,lifesteal:0,slow:0};
function recomputeBuffs(){
  buffMul={dmg:1,rate:1,speed:1,resist:1,regen:0,crit:0,pierce:0,dashCd:1,combo:1,lifesteal:0,slow:0};
  for(const b of buffs){
    const d=BUFF_DEFS[b.id]; if(!d) continue;
    if(d.dmg) buffMul.dmg*=d.dmg;
    if(d.rate) buffMul.rate*=d.rate;
    if(d.speed) buffMul.speed*=d.speed;
    if(d.resist) buffMul.resist*=d.resist;
    if(d.regen) buffMul.regen+=d.regen;
    if(d.crit) buffMul.crit+=d.crit;
    if(d.pierce) buffMul.pierce+=d.pierce;
    if(d.dashCd) buffMul.dashCd*=d.dashCd;
    if(d.combo) buffMul.combo*=d.combo;
    if(d.lifesteal) buffMul.lifesteal+=d.lifesteal;
    if(d.slow) buffMul.slow+=d.slow;
  }
}
function addBuff(id,dur){
  dur=dur||CFG.buff.duration;
  const d=BUFF_DEFS[id]; if(!d) return false;
  const ex=buffs.find(b=>b.id===id);
  if(ex){ ex.t=Math.max(ex.t,dur); ex.maxT=Math.max(ex.maxT,dur); }
  else {
    buffs.push({id,t:dur,maxT:dur,pulse:14});
    if(d.maxHp){ player.maxHp+=d.maxHp; player.hp=Math.min(player.maxHp,player.hp+d.maxHp); }
    if(player){
      FX.levelUpBurst(player.x,player.y,d.c);
    }
    FX.text(player.x,player.y-56,d.n,d.c,20);
    SFX.buff(); emit('buff',id);
  }
  recomputeBuffs();
  return true;
}
function removeBuff(id){
  const i=buffs.findIndex(b=>b.id===id); if(i<0) return;
  const d=BUFF_DEFS[id];
  if(d&&d.maxHp){ player.maxHp=Math.max(50,player.maxHp-d.maxHp); player.hp=Math.min(player.hp,player.maxHp); }
  buffs.splice(i,1); recomputeBuffs();
}
function updateBuffs(dt){
  for(let i=buffs.length-1;i>=0;i--){
    const b=buffs[i]; b.t-=dt; if(b.pulse>0)b.pulse-=dt;
    if(b.t<=0) removeBuff(b.id);
  }
  const tr=(buffMul.regen||0)+(stats.loadoutRegen||0);
  if(tr>0 && player.hp<player.maxHp) player.hp=Math.min(player.maxHp,player.hp+tr/60*dt);
}
function clearBuffs(){ for(const b of buffs.slice()) removeBuff(b.id); buffs=[]; recomputeBuffs(); }

function buildGeneratedPool(){
  const pool=[];
  for(const a of GEN_ATTRS){
    for(let t=0;t<TIER_NAMES.length;t++){
      const tier=TIER_NAMES[t];
      const pre=a.pre[Math.floor(Math.random()*a.pre.length)];
      const core=a.core[Math.floor(Math.random()*a.core.length)];
      const id=`g_${a.id}_${t}_${Math.floor(Math.random()*99999)}`;
      pool.push({id,n:pre+core,
        i:a.id==='dmg'?'D':a.id==='rate'?'F':a.id==='spd'?'S':a.id==='crit'?'C'
          :a.id==='critx'?'X':a.id==='hp'?'H':a.id==='ls'?'L':a.id==='pierce'?'='
          :a.id==='dashcd'?'>':a.id==='combo'?'O':a.id==='bullet'?'B':'*',
        c:a.c,max:3+t,rarity:tier.rar,d:a.txt(tier.v),a:()=>a.f(tier.v)});
    }
  }
  return pool;
}
const GENERATED_POOL=buildGeneratedPool();

function rollCards(n=3,allowCurse=true){
  const out=[];
  if(allowCurse && activeCurses.length<4 && Math.random()<.25){
    const avail=CURSES.filter(x=>!activeCurses.find(a=>a.id===x.id) && !stats.taken['curse_'+x.id]);
    if(avail.length){
      const curse=avail[Math.floor(Math.random()*avail.length)];
      out.push({id:'curse_'+curse.id,n:curse.n,i:curse.i,c:curse.c,
        d:curse.d+`\n达成「${curse.q}」后逆转`,max:1,rarity:'curse',isCurse:true,
        curseRef:curse,a:()=>applyCurse(curse)});
    }
  }
  const pool=ALL_CARDS.filter(u=>(stats.taken[u.id]||0)<u.max);
  const bag=pool.slice();
  const wOf=u=>u.rarity==='legend'?.3:u.rarity==='epic'?.7:u.rarity==='rare'?1:1.3;
  while(out.length<n && bag.length){
    let total=0; for(const b of bag) total+=wOf(b);
    let r=Math.random()*total; let idx=0;
    for(let i=0;i<bag.length;i++){ r-=wOf(bag[i]); if(r<=0){ idx=i; break; } }
    out.push(bag.splice(idx,1)[0]);
  }
  return out;
}
function applyCurse(curse){
  activeCurses.push({id:curse.id,ref:curse,prog:0,done:false,maxProg:curse.need,pulse:20});
  SFX.curse();
  if(curse.id==='greed'){stats.curseDmg*=2;stats.selfShot+=1;}
  if(curse.id==='frail'){stats.curseSpd*=1.8;stats.curseResist*=.66;}
  if(curse.id==='bloodmoon'){stats.curseRate*=1.9;stats.noRegen=true;}
  if(curse.id==='glass'){stats.critChance+=.5;stats.critMul+=1.2;
    player.maxHp=Math.max(50,player.maxHp-40);player.hp=Math.min(player.hp,player.maxHp);}
  if(curse.id==='wager'){stats.curseComboMult=2;stats.curseComboZero=10;}
  if(curse.id==='sacrifice'){stats.curseNoBomb=true;stats.curseDmg*=1.4;}
  if(curse.id==='hunger'){stats.cursePickupCost=5;stats.cursePickupBuff=2.5;}
  if(curse.id==='solitude'){stats.curseDmg*=1.8;stats.curseBuffTime=.5;}
  if(curse.id==='fragile_echo'){stats.curseRate*=2.5;stats.curseDoubleDmg=2;}
  if(curse.id==='blind_luck'){stats.luckMul*=3;stats.critChance=0;}
  FX.text(player.x,player.y-70,'诅咒缠身',curse.c,22);
  FX.flash(player.x,player.y,curse.c,12,90,30);
  FX.ring(player.x,player.y,180,3,curse.c);
  FX.shardBurst(player.x,player.y,curse.c,14,1.5);
  shake=20; flash=.6;
  emit('curse',curse.id);
  return true;
}
function tickCurse(track,amount,mode){
  for(const ac of activeCurses){
    if(ac.done||ac.ref.track!==track) continue;
    if(mode==='max') ac.prog=Math.max(ac.prog,amount); else ac.prog+=amount;
    ac.pulse=12;
    if(ac.prog>=ac.maxProg) blessCurse(ac);
  }
}
function blessCurse(ac){
  ac.done=true;
  const b=ac.ref.bless;
  if(ac.id==='greed'){stats.curseDmg/=2;stats.selfShot=0;stats.dmgMul*=2.3;}
  if(ac.id==='frail'){stats.curseSpd/=1.8;stats.curseResist/=.66;stats.speedMul*=1.95;}
  if(ac.id==='bloodmoon'){stats.curseRate/=1.9;stats.noRegen=false;stats.fireRate*=2.1;}
  if(ac.id==='glass'){stats.critChance-=.5;stats.critMul-=1.2;player.maxHp+=40;player.hp+=40;
    stats.critChance+=.65;stats.critMul+=1.5;}
  if(ac.id==='wager'){stats.curseComboMult=1;stats.curseComboZero=0;stats.curseComboMult=2.5;}
  if(ac.id==='sacrifice'){stats.curseNoBomb=false;stats.curseDmg/=1.4;stats.dmgMul*=1.7;}
  if(ac.id==='hunger'){stats.cursePickupCost=0;stats.cursePickupBuff=1;stats.luckMul*=2.8;}
  if(ac.id==='solitude'){stats.curseDmg/=1.8;stats.curseBuffTime=1;stats.dmgMul*=2.1;stats.comboWindowMul*=1.5;}
  if(ac.id==='fragile_echo'){stats.curseRate/=2.5;stats.curseDoubleDmg=1;stats.fireRate*=2.5;}
  if(ac.id==='blind_luck'){stats.luckMul/=3;stats.critChance+=.3;}
  stats.taken['curse_'+ac.id]=99;
  activeCurses=activeCurses.filter(x=>x!==ac);
  SFX.bless();
  FX.flash(player.x,player.y,'#ffd166',16,140,30);
  FX.flash(player.x,player.y,'#fff',10,90,24,Math.PI/12);
  FX.sparkBurst(player.x,player.y,'#ffd166',50,16,9);
  FX.glow(player.x,player.y,40,100,'#fff');
  FX.ring(player.x,player.y,Math.max(W,H)*.5,4,'#ffd166');
  FX.shardBurst(player.x,player.y,'#ffd166',18,1.8);
  shake=24;bombFlash=.8;
  FX.text(player.x,player.y-70,'诅咒逆转 '+b.n,'#ffd166',24,true);
  FX.text(player.x,player.y-40,b.d,'#fff',14);
  emit('bless',ac.id);
}

  {id:'splitter',name:'分裂者',hp:200,r:60,spd:.48,color:'#5aff9d',c2:'#a0ffcc',score:1000,cd:52,skills:['split','spiral']},
  {id:'vortex',name:'漩涡',hp:250,r:54,spd:.52,color:'#4dd2ff',c2:'#a0e8ff',score:1200,cd:46,skills:['pull','ring']},
  {id:'overlord',name:'霸主',hp:380,r:68,spd:.42,color:'#ff4d6d',c2:'#ffa0b0',score:2000,cd:38,skills:['fan','spiral','charge','summon']},
];
function bossPick(wave){
  const idx=Math.floor(wave/CFG.waves.bossEvery-1)%BOSS_DEFS.length;
  return BOSS_DEFS[Math.max(0,idx)];
}
function bossSkill(e,out,dx,dy,d){
  const st=e.skillTimer=(e.skillTimer||0)+1;
  const skills=e.bossDef.skills;
  const skill=skills[Math.floor(st/e.cdBase)%skills.length];
  if(!(e.cd<=0 && e.spawn<=0 && e.invuln<=0)) return;
  if(skill==='fan'){ for(let k=-3;k<=3;k++)
    out.push(mkEBullet(e.x,e.y,e.ang+k*.16,4.6,6,e.bossDef.c2)); e.cd=e.cdBase; }
  else if(skill==='summon'){ for(let k=0;k<2;k++){
    const a=rnd(0,TAU);
    const m=spawnEnemy(Math.random()<.5?'grunt':'dart',e.x+Math.cos(a)*70,e.y+Math.sin(a)*70);
    if(m) m.spawn=25;} e.cd=e.cdBase*1.5; }
  else if(skill==='laser'){ const base=e.ang;
    for(let k=-1;k<=1;k++) lasers.push({x:e.x,y:e.y,ang:base+k*.5,t:60,maxT:60,
      len:Math.max(W,H),color:e.bossDef.c2,dmg:18}); e.cd=e.cdBase*2; }
  else if(skill==='ring'){ const n=20;
    for(let k=0;k<n;k++) out.push(mkEBullet(e.x,e.y,k/n*TAU,3.4,6.5,e.bossDef.c2));
    e.cd=e.cdBase*1.3; }
  else if(skill==='charge'){ e.charging=50;e.chargeDx=dx;e.chargeDy=dy;e.cd=e.cdBase*1.8; }
  else if(skill==='shockwave'){ shockwaves.push({x:e.x,y:e.y,r:20,maxR:Math.max(W,H)*.55,
    life:1,color:e.bossDef.c2,dmg:16}); e.cd=e.cdBase*1.5; }
  else if(skill==='split'){
    if(e.hp<=e.maxHp*.5 && !e.split){ e.split=true;e.invuln=60;
      const sub=BOSS_DEFS[0];
      for(let k=0;k<2;k++){ const a=k===0?0:Math.PI;
        const se=spawnEnemy('boss',e.x+Math.cos(a)*80,e.y+Math.sin(a)*80);
        if(se){ se.bossDef=sub;se.hp=se.maxHp=Math.round(e.maxHp*.28);
          se.r=e.r*.62;se.color=sub.color;se.isSub=true;se.spawn=30;}}}
    e.cd=e.cdBase; }
  else if(skill==='spiral'){ const n=8,base=e.ang+st*.15;
    for(let k=0;k<n;k++) out.push(mkEBullet(e.x,e.y,base+k/n*TAU,4,e.bossDef.c2));
    e.cd=e.cdBase; }
  else if(skill==='pull'){
    if(d<400 && player.invuln<=0){ player.vx+=(e.x-player.x)/d*.7; player.vy+=(e.y-player.y)/d*.7; }
    if(st%30===0) for(let k=0;k<12;k++) out.push(mkEBullet(e.x,e.y,k/12*TAU,3.6,6,e.bossDef.c2));
    e.cd=e.cdBase; }
}
function drawBoss(e,gg){
  const col=e.hit>0?'#fff':e.bossDef.color;
  const c2=e.bossDef.c2;
  gg.fillStyle=col;
  gg.beginPath();
  for(let i=0;i<6;i++){
    const a=i/6*TAU-Math.PI/2;
    const px=Math.cos(a)*e.r, py=Math.sin(a)*e.r;
    i?gg.lineTo(px,py):gg.moveTo(px,py);
  }
  gg.closePath(); gg.fill();
  gg.strokeStyle='#fff'; gg.lineWidth=2.2;
  gg.beginPath(); gg.arc(0,0,e.r*.68,0,TAU); gg.stroke();
  gg.strokeStyle=c2;
  gg.beginPath(); gg.arc(0,0,e.r*.44,0,TAU); gg.stroke();
  const cg=gg.createRadialGradient(0,0,2,0,0,e.r*.32);
  cg.addColorStop(0,'#fff');
  cg.addColorStop(.55,e.bossDef.color);
  cg.addColorStop(1,'#300');
  gg.fillStyle=cg;
  gg.beginPath(); gg.arc(0,0,e.r*.32,0,TAU); gg.fill();
}

function spawnWave(){
  wave++; stats2.waves++; tickCurse('waves',1);
  const isBoss=wave%CFG.waves.bossEvery===0;
  banner=CFG.waves.bannerTime;
  bannerText=isBoss?'BOSS':'WAVE '+wave;
  isBoss ? SFX.boss() : SFX.wave();
  const volley=stats.evolution.volley||0;
  if(volley>0) for(let k=0;k<12*volley;k++){
    const a=k/(12*volley)*TAU;
    bullets.push(mkBullet(player.x,player.y,Math.cos(a)*8,Math.sin(a)*8,4,'#ffd166',2,0));
  }
  if(stats.nukeOnWave>0 && wave%3===0){
    bombFlash=.9;shake=26;
    FX.flash(player.x,player.y,'#ff3366',16,160,30);
    FX.ring(player.x,player.y,Math.max(W,H)*.9,5,'#ff3366');
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(e.type==='boss'){e.hp-=e.maxHp*.15;continue;}
      e.hp-=999; if(e.hp<=0) killEnemy(e,true);
    }
  }
  if(isBoss){
    const def=bossPick(wave);
    const e={type:'boss',x:W/2,y:-120,r:def.r,
      hp:def.hp*(1+wave*.02),maxHp:def.hp*(1+wave*.02),
      spd:def.spd,color:def.color,score:def.score,cdBase:def.cd,cd:60,
      ang:Math.PI/2,hit:0,spawn:80,invuln:0,pattern:0,
      bossDef:def,def:null,skillTimer:0};
    enemies.push(e);
    for(let i=0;i<2+Math.floor(wave/5);i++){
      const m=spawnEnemy(Math.random()<.5?'grunt':'dart',rnd(60,W-60),-40);
      if(m) m.spawn=40+i*14;
    }
  } else {
    const n=CFG.waves.baseCount+wave*CFG.waves.perWave;
    const pool=['grunt','grunt','dart'];
    if(wave>=3) pool.push('tank');
    if(wave>=4) pool.push('sniper','shielder');
    if(wave>=5) pool.push('splitter');
    if(wave>=6) pool.push('homing','tank');
    if(wave>=7) pool.push('bomber','orbiter');
    if(wave>=8) pool.push('shielder','homing','sniper','phantom');
    if(wave>=9) pool.push('healer','summoner');
    if(wave>=10) pool.push('railgunner','jammer');
    if(wave>=12) pool.push('splitter','summoner','railgunner','orbiter','phantom');
    if(wave>=15) pool.push('healer','bomber','jammer','splitter');
    for(let i=0;i<n;i++){
      const t=pool[Math.floor(Math.random()*pool.length)];
      const edge=Math.floor(Math.random()*4);
      let x,y;
      if(edge===0){x=rnd(0,W);y=-40;}
      else if(edge===1){x=W+40;y=rnd(0,H);}
      else if(edge===2){x=rnd(0,W);y=H+40;}
      else{x=-40;y=rnd(0,H);}
      spawnEnemy(t,x,y);
    }
  }
  emit('wave',{wave,isBoss});
}
function spawnEnemy(type,x,y){

  const e={type,x,y,r:d.r,hp:d.hp,maxHp:d.hp,spd:d.spd,color:d.color,

    charging:0, blinkT:80, orbit:rnd(0,TAU), exploding:false};

function impact(x,y,power,col){

  shake=Math.min(32,shake+2+power*6);

function tryDash(){
  if(phase!=='play'||!alive||player.dashCd>0) return;
  let dx=0,dy=0;

function killEnemy(e,byBomb){
  const isBoss=e.type==='boss';
  const big=isBoss||e.type==='tank';
  impact(e.x,e.y,isBoss?2.6:big?1.4:.7,e.color);
  FX.explosion(e.x,e.y,e.color,isBoss?2:big?1.4:.9);
  if(isBoss){
    bombFlash=.9;
    FX.flash(e.x,e.y,'#fff',20,220,40);
    FX.flash(e.x,e.y,e.color,16,180,32,Math.PI/16);
    FX.ring(e.x,e.y,Math.max(W,H)*.8,6,'#fff');
    FX.glow(e.x,e.y,50,140,'#fff');
    SFX.bigkill();
    if(stats.endRing){
      for(const e2 of enemies){
        if(e2===e) continue;
        e2.hp-=e2.maxHp*.3;
        if(e2.hp<=0) killEnemy(e2,false);
      }
    }
    if(stats.blackholeOnKill>0) for(let k=0;k<stats.blackholeOnKill;k++)
      blackholes.push({x:e.x,y:e.y,r:20,maxR:250,life:1});
  } else if(big) SFX.bigkill();
  else SFX.kill();
  if(stats.endRing && !isBoss) stats.endRingStacks=Math.min(30,(stats.endRingStacks||0)+1);
  combo++; comboTimer=comboWindow();
  stats2.maxCombo=Math.max(stats2.maxCombo,comboMult());
  tickCurse('maxCombo',comboMult(),'max');
  const mult=comboMult();
  const gain=Math.round(e.score*mult);
  score+=gain;
  runCoins+=Math.round(e.score*(stats.coinMul||1)*.15);
  FX.text(e.x,e.y-14,'+'+gain+(mult>1?' x'+mult:''),e.color,isBoss?24:16);
  stats2.kills++; tickCurse('kills',1);
  if(player.hp<player.maxHp*.3) tickCurse('lowkills',1);
  const ls=EFF.lifesteal();
  if(ls>0){
    const need=player.maxHp-player.hp;
    if(need>0){
      player.hp+=Math.min(ls,need);
      FX.text(player.x,player.y-40,'+'+Math.round(Math.min(ls,need)),'#5aff9d',14);
    } else if(stats.evolution.vampShield){
      player.shield=Math.min(5,player.shield+1);
      FX.text(player.x,player.y-40,'SH+','#5aff9d',14);
    }
  }
  if(stats.regenKill>0) player.hp=Math.min(player.maxHp,player.hp+stats.regenKill);
  const ric=stats.evolution.ricochet||0;
  if(ric>0) for(let k=0;k<3*ric;k++){
    const a=rnd(0,TAU);
    bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*7,vy:Math.sin(a)*7,
      r:3.5,color:'#c77dff',dmg:Math.round(2*EFF.dmg()),pierce:0,
      life:80,trail:[],homing:.06,sizeMul:1,split:0,explosive:0,
      frost:0,poison:0,chain:0,bounce:0});
  }
  const cl=stats.taken.cocktail||0;
  if(cl>0){
    for(let i=0;i<cl;i++) addBuff(BUFF_IDS[Math.floor(Math.random()*BUFF_IDS.length)]);
    stats2.maxbuffs=Math.max(stats2.maxbuffs,buffs.length);
    tickCurse('maxbuffs',buffs.length,'max');
  }
  const chance=isBoss?1:(e.def&&e.def.drop?1:.12*stats.luckMul);
  const count=isBoss?5:(Math.random()<chance?1:0);
  for(let i=0;i<count;i++){
    const r=Math.random(); let type;
    if(r<.32) type='heal';
    else if(r<.56) type='weapon';
    else if(r<.72) type='bomb';
    else if(r<.88) type='shield';
    else type='slow';
    drops.push({x:e.x+rnd(-20,20),y:e.y+rnd(-20,20),
      vx:rnd(-2,2),vy:rnd(-2.5,-.5),type,life:560,bob:rnd(0,TAU)});
  }
  gainXP(Math.round((isBoss?240:Math.round(e.score/2))*(stats.xpMul||1)));
  const i=enemies.indexOf(e);
  if(i>=0) enemies.splice(i,1);
  if(e.def && e.def.onDeath) e.def.onDeath(e);
  emit('kill',{enemy:e,combo,mult,byBomb:!!byBomb,isBoss});
}
function comboMult(){
  const lv=Math.floor(combo/CFG.combo.perLevel);
  return Math.min(comboMax(),1+lv*CFG.combo.step);
}
function gainXP(n){
  xp+=n;
  while(xp>=xpNeed){
    xp-=xpNeed; level++;
    xpNeed=Math.round(xpNeed*CFG.level.growth);
    pendingLevels++;
  }
}
