   主循环
   ============================================================ */
let lastTime=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const ff=Math.min(3,(now-lastTime)/16.667)||1;
  lastTime=now;
  if(phase==='levelup'){ render(0); return; }
  if(phase!=='play' && phase!=='over') return;
  if(hitStop>0){
    hitStop--;
    shake*=.86;
    flash=Math.max(0,flash-.06);
    impactWhite=Math.max(0,impactWhite-.08);
    if(banner>0) banner--;
    FX.update(0.3, player?player.vx:0, player?player.vy:0);
    render(0);
    return;
  }
  if(!alive){ updateFX(ff); render(ff); return; }
  if(pendingLevels>0 && !luBusy && phase==='play'){ pendingLevels--; showLevelUp(); return; }
  update(ff); render(ff);
}
function update(ff){
  if(!player) return;
  const maxSpd=CFG.maxSpdBase*EFF.speed();
  const slowMul=EFF.slowMul();
  const oldX=player.x, oldY=player.y;
  stats._jammer=1;
  updateBuffs(ff);
  if(player.shieldGlow>0) player.shieldGlow-=ff;

  if(player.dashT>0){
    player.dashT-=ff;
    player.vx=player.dashVx; player.vy=player.dashVy;
    player.dashVx*=.90; player.dashVy*=.90;
    for(let i=ebullets.length-1;i>=0;i--){
      if(dist(ebullets[i],player)<CFG.player.dashClearRadius){
        FX.sparkBurst(ebullets[i].x,ebullets[i].y,'#0ff',4,6,4);
        ebullets.splice(i,1);
      }
    }
    if(stats.dashPierce>0) for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(dist(e,player)<e.r+player.r){
        e.hp-=Math.ceil(4*stats.dashPierce); e.hit=6;
        FX.sparkBurst(e.x,e.y,'#0ff',6,8,5);
        if(e.hp<=0) killEnemy(e);
      }
    }
    if(player.dashT<=0 && stats.dashExplode>0){
      FX.explosion(player.x,player.y,'#ff9d00',1);
      for(const e of enemies){
        if(dist(e,player)<120){ e.hp-=Math.ceil(6*stats.dashExplode); e.hit=6;
          if(e.hp<=0) killEnemy(e);}
      }
    }
    FX.dot(player.x+rnd(-6,6),player.y+rnd(-6,6),0,0,14,5,'#0ff');
  } else if(JOY.active && (Math.abs(JOY.dx)>CFG.player.joyDead||Math.abs(JOY.dy)>CFG.player.joyDead)){
    player.vx+=(JOY.dx*maxSpd-player.vx)*CFG.player.joyFollow*ff;
    player.vy+=(JOY.dy*maxSpd-player.vy)*CFG.player.joyFollow*ff;
  } else {
    let kx=0,ky=0;
    if(keys['arrowleft']||keys['a']) kx-=1;
    if(keys['arrowright']||keys['d']) kx+=1;
    if(keys['arrowup']||keys['w']) ky-=1;
    if(keys['arrowdown']||keys['s']) ky+=1;
    if(kx||ky){
      const n=Math.hypot(kx,ky);
      player.vx+=(kx/n*maxSpd-player.vx)*CFG.player.joyFollow*ff;
      player.vy+=(ky/n*maxSpd-player.vy)*CFG.player.joyFollow*ff;
    } else { player.vx*=Math.pow(.87,ff); player.vy*=Math.pow(.87,ff); }
  }
  player.vx=clamp(player.vx,-maxSpd,maxSpd);
  player.vy=clamp(player.vy,-maxSpd,maxSpd);
  player.x=clamp(player.x+player.vx*ff,22,W-22);
  player.y=clamp(player.y+player.vy*ff,22,H-22);
  if(player.x<=22||player.x>=W-22) player.vx*=.35;
  if(player.y<=22||player.y>=H-22) player.vy*=.35;
  const realVx=player.x-oldX, realVy=player.y-oldY;
  player.tilt+=(clamp(realVx*.06,-.42,.42)-player.tilt)*.25*ff;
  player.thr=Math.min(1,player.thr+.15*ff);
  if(Math.hypot(realVx,realVy)>.5 && Math.random()<.4){
    FX.dot(player.x+rnd(-3,3),player.y+12,
      rnd(-.5,.5)+player.vx*.05,rnd(.5,2)+player.vy*.05,
      rnd(14,20),rnd(2,3.5),'#0aa');
  }
  if(player.invuln>0) player.invuln-=ff;
  if(player.dashCd>0) player.dashCd-=ff;
  if(player.muzzle>0) player.muzzle-=ff;
  if(player.dashBuffT>0) player.dashBuffT-=ff;
  if(slowTimer>0) slowTimer-=ff;
  if(slowFlash>0) slowFlash-=ff;
  if(player.cd>0) player.cd-=ff;
  if(player.cd<=0){
    const w=WEAPONS[player.weapon]||WEAPONS[0];
    const before=bullets.length;
    w.fire(player,bullets);
    const extra=stats.multishot;
    if(extra>0) for(let k=0;k<extra;k++){
      const off=(k-(extra-1)/2)*6, ang=(k-(extra-1)/2)*.13;
      bullets.push(mkBullet(player.x+off,player.y-16,Math.sin(ang)*12,-Math.cos(ang)*12,3.4,w.color,1,0));
    }
    const echo=stats.evolution.echo||0;
    if(echo>0 && Math.random()<.2*echo) w.fire(player,bullets);
    player.chargeT=(player.chargeT||0)+ff;
    const ci=Math.max(60,180/stats.chargeShot);
    if(stats.chargeShot>0 && player.chargeT>=ci){
      player.chargeT=0;
      const cb=mkBullet(player.x,player.y-18,0,-18,9,'#0ff',3,3);
      cb.sizeMul=2.5; bullets.push(cb);
      FX.ring(player.x,player.y,70,2.5,'#0ff');
    }
    player.shotCount=(player.shotCount||0)+1;
    if(stats.laser>0 && player.shotCount%5===0)
      bullets.push({x:player.x,y:player.y-20,vx:0,vy:-24,r:6,
        color:'#ff3366',dmg:3,pierce:99,life:60,trail:[],sizeMul:1.5,
        homing:0,bounce:0,split:0,explosive:0,frost:0,poison:0,chain:0});
    const dmgMul=EFF.dmg();
    const totalPierce=EFF.pierce();
    for(let i=before;i<bullets.length;i++){
      const b=bullets[i];
      b.dmg=Math.max(1,Math.round(b.dmg*dmgMul));
      b.pierce+=totalPierce;
      b.homing=stats.homing; b.bounce=stats.bounce;
      b.split=stats.splitOnHit; b.explosive=stats.explosive;
      b.frost=stats.frost; b.poison=stats.poison; b.chain=stats.chainLightning;
      b.sizeMul=stats.bulletSize*b.sizeMul; b.r*=b.sizeMul;
    }
    player.cd=Math.max(2,Math.round(w.cd/EFF.rate()));
    player.muzzle=4;
    player.vy+=.08*ff;
    FX.sparkBurst(player.x,player.y-18,w.color,3,5,4);
    SFX.shoot();
    if(stats.selfShot>0 && !godMode){
      player.hp-=stats.selfShot;
      if(player.hp<=0) gameOver();
    }
  }
  if(enemies.length===0 && !waveCleared){ waveCleared=true; onWaveClear(); }
  if(waveCleared){
    waveTimer-=ff;
    if(waveTimer<=0){ spawnWave(); waveCleared=false; waveTimer=CFG.waves.nextDelay; }
  }
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.homing && alive){
      let best=null,bd=1e9;
      for(const e of enemies){ const d=dist(b,e); if(d<bd){bd=d;best=e;} }
      if(best){
        const ta2=Math.atan2(best.y-b.y,best.x-b.x);
        const ca=Math.atan2(b.vy,b.vx);
        const na=ca+clamp(angDiff(ta2,ca),-b.homing,b.homing);
        const s=Math.hypot(b.vx,b.vy);
        b.vx=Math.cos(na)*s; b.vy=Math.sin(na)*s;
      }
    }
    b.x+=b.vx*ff; b.y+=b.vy*ff; b.life-=ff;
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>6) b.trail.shift();
    if(b.y<-40||b.y>H+40||b.x<-40||b.x>W+40||b.life<=0){
      if(b.bounce>0){
        b.bounce--;
        if(b.x<-20||b.x>W+20) b.vx=-b.vx;
        if(b.y<-20||b.y>H+20) b.vy=-b.vy;
        b.life=30;
      } else { bullets.splice(i,1); continue; }
    }
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(e.invuln>0) continue;
      if(dist(b,e)<e.r+b.r){
        let dmg=b.dmg, crit=false;
        const cc=EFF.crit();
        if(cc>0 && Math.random()<cc){ dmg=Math.round(dmg*stats.critMul); crit=true; }
        if(e.def && e.def.shield){
          const incoming=Math.atan2(-b.vy,-b.vx);
          if(Math.abs(angDiff(incoming,e.ang))<Math.PI*.5){
            dmg=Math.max(1,Math.ceil(dmg*.34));
            FX.text(b.x,b.y-10,'BLOCK','#5aff9d',12);
            FX.sparkBurst(b.x,b.y,'#5aff9d',4,5,4);
          }
        }
        if(stats.executionKill>0 && e.hp/e.maxHp<stats.executionThreshold){
          dmg=e.hp;
          FX.text(e.x,e.y-30,'斩杀','#ff3366',18,true);
        }
        if(e.type==='boss' && stats.bossSlayer>0) dmg=Math.round(dmg*(1+stats.bossSlayer));
        e.hp-=dmg; e.hit=6;
        if(crit){ stats2.critkills++; tickCurse('critkills',1); }
        if(b.frost>0) e.slowT=Math.max(e.slowT||0,60+30*b.frost);
        if(b.poison>0) e.poisonT=Math.max(e.poisonT||0,180);
        if(b.explosive>0){
          const splash=Math.ceil(dmg*.5*b.explosive);
          FX.explosion(b.x,b.y,'#ff9d00',.7);
          for(const e2 of enemies){
            if(e2===e) continue;
            if(dist(e2,b)<60+16*b.explosive){
              e2.hp-=splash; e2.hit=6;
              if(e2.hp<=0) killEnemy(e2);
            }
          }
        }
        if(b.chain>0){
          const chains=[];
          for(const e2 of enemies){
            if(e2===e) continue;
            if(dist(e2,e)<120 && chains.length<b.chain) chains.push(e2);
          }
          for(const e2 of chains){
            e2.hp-=Math.ceil(dmg*.5); e2.hit=6;
            FX.bolt(e.x,e.y,e2.x,e2.y,10,'#ffd166');
            if(e2.hp<=0) killEnemy(e2);
          }
        }
        if(crit && stats.criticalAoE>0) for(const e2 of enemies){
          if(e2===e) continue;
          if(dist(e2,e)<80){
            e2.hp-=Math.ceil(dmg*.3*stats.criticalAoE); e2.hit=6;
            if(e2.hp<=0) killEnemy(e2);
          }
        }
        if(b.split>0) for(let k=0;k<2*b.split;k++){
          const a=Math.atan2(b.vy,b.vx)+(k-.5)*.5;
          bullets.push(mkBullet(b.x,b.y,Math.cos(a)*6,Math.sin(a)*6,2.5,b.color,Math.ceil(b.dmg*.5),0));
        }
        const pw=crit?1:.35;
        hitStop=Math.max(hitStop,crit?5:1);
        shake=Math.min(28,shake+(crit?7:2));
        impactWhite=Math.max(impactWhite,crit?.2:.07);
        aber=Math.max(aber,crit?.85:.35);
        if(crit){
          FX.crit(b.x,b.y,'#ff3366');
          SFX.crit();
          FX.text(e.x,e.y-26,dmg,'#ff3366',16,true);
        } else {
          FX.hit(b.x,b.y,'#fff',pw);
          SFX.hit();
        }
        if(b.bounce>0 && b.pierce<=0){
          b.bounce--;
          const nearest=enemies.filter(e2=>e2!==e).sort((x,y)=>dist(x,b)-dist(y,b))[0];
          if(nearest){
            const a=Math.atan2(nearest.y-b.y,nearest.x-b.x);
            const s=Math.hypot(b.vx,b.vy)||10;
            b.vx=Math.cos(a)*s; b.vy=Math.sin(a)*s;
            b.life=Math.max(b.life,30);
          } else bullets.splice(i,1);
        } else if(b.pierce>0){ b.pierce--; }
        else bullets.splice(i,1);
        if(e.hp<=0) killEnemy(e);
        break;
      }
    }
  }
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const dx=player.x-e.x, dy=player.y-e.y;
    const d=Math.hypot(dx,dy)||1;
    const want=Math.atan2(dy,dx);
    e.ang+=angDiff(want,e.ang)*.08*ff;
    let spd=e.spd*slowMul;
    if(e.slowT>0){ spd*=.55; e.slowT-=ff; }
    if(e.poisonT>0){
      e.poisonT-=ff;
      e.poisonTick=(e.poisonTick||0)+ff;
      while(e.poisonTick >= 20 && e.poisonT > 0){
        e.poisonTick -= 20;
        e.hp -= 1;
        FX.dot(e.x+rnd(-6,6),e.y+rnd(-6,6),0,-.5,18,3,'#5aff9d');
      }
      if(e.hp<=0){ killEnemy(e); continue; }
    }
    for(const bh of blackholes){
      const dd=dist(e,bh);
      if(dd<bh.r && dd>1){ e.x+=(bh.x-e.x)/dd*.8*ff; e.y+=(bh.y-e.y)/dd*.8*ff; }
    }
    if(e.type==='boss'){
      if(e.charging && e.charging>0){
        e.charging-=ff;
        e.x+=e.chargeDx*14*ff; e.y+=e.chargeDy*14*ff;
        if(Math.random()<.5) FX.dot(e.x+rnd(-10,10),e.y+rnd(-10,10),0,0,12,6,e.bossDef.c2);
        if(e.charging<=0)
          shockwaves.push({x:e.x,y:e.y,r:20,maxR:340,life:1,color:e.bossDef.c2,dmg:14});
      } else {
        const target=210;
        const sign=d>target+24?1:d<target-24?-1:0;
        e.x+=Math.cos(e.ang)*spd*sign*ff;
        e.y+=Math.sin(e.ang)*spd*sign*ff;
        const drift=Math.sin(Date.now()*.0009)*spd*1.5;
        e.x+=Math.cos(e.ang+Math.PI/2)*drift*ff;
        e.y+=Math.sin(e.ang+Math.PI/2)*drift*ff;
      }
    } else if(e.def && e.def.move){
      e.def.move(e, dx/d, dy/d, d, spd);
    } else {
      e.x+=Math.cos(e.ang)*spd*ff;
      e.y+=Math.sin(e.ang)*spd*ff;
    }
    if(e.spawn>0) e.spawn-=ff;
    if(e.hit>0) e.hit-=ff;
    if(e.invuln>0) e.invuln-=ff;
    if(e.type==='dart' && Math.random()<.3)
      FX.dot(e.x,e.y,0,0,8,4,'#553300');
    if(e.type==='boss'){
      if(!e.phase2 && e.hp<=e.maxHp*.5){
        e.phase2=true; e.invuln=70; ebullets.length=0;
        FX.flash(e.x,e.y,e.bossDef.color,16,220,32);
        FX.flash(e.x,e.y,'#fff',10,160,24,Math.PI/12);
        FX.sparkBurst(e.x,e.y,e.bossDef.color,40,16,10);
        FX.glow(e.x,e.y,50,150,'#fff');
        FX.ring(e.x,e.y,Math.max(W,H)*.6,5,'#fff');
        shake=26; bombFlash=.7; aber=1;
        FX.text(e.x,e.y-80,'PHASE 2',e.bossDef.color,26,true);
        SFX.boss();
      }
      if(e.cd>0) e.cd-=ff;
      if(e.cd<=0 && e.spawn<=0 && e.invuln<=0)
        bossSkill(e,ebullets,dx/d,dy/d,d);
    } else {
      if(e.cd>0) e.cd-=ff;
      if(e.def && e.def.tick) e.def.tick(e, dx/d, dy/d, d);
      if(e.cd<=0 && e.spawn<=0 && e.invuln<=0 && e.def.shoot){
        e.def.shoot(e,dx/d,dy/d,ebullets);
        e.cd=e.cdBase;
      }
    }
    if(e.type!=='boss' && dist(e,player)<e.r+player.r && player.invuln<=0){
      if(e.type!=='bomber'){
        damagePlayer(e.type==='tank'?25:15);
        FX.sparkBurst(player.x,player.y,'#7fffd4',12,8,6);
        if(!alive) break;
      }
    }
    if(e.type==='boss' && dist(e,player)<e.r*.7+player.r && player.invuln<=0){
      damagePlayer(22);
      FX.sparkBurst(player.x,player.y,e.bossDef.color,14,8,6);
      if(!alive) break;
    }
  }
  for(let i=shockwaves.length-1;i>=0;i--){
    const s=shockwaves[i];
    s.r+=(s.maxR-s.r)*.08*ff; s.life-=.02*ff;
    if(player.invuln<=0 && Math.abs(dist(s,player)-s.r)<18){
      damagePlayer(s.dmg);
      FX.sparkBurst(player.x,player.y,'#ffd166',10,7,5);
    }
    if(s.life<=0) shockwaves.splice(i,1);
  }
  for(let i=lasers.length-1;i>=0;i--){
    const l=lasers[i]; l.t-=ff;
    if(l.t<=0){
      if(player.invuln<=0){
        const ddx=player.x-l.x, ddy=player.y-l.y;
        const dp=ddx*Math.cos(l.ang)+ddy*Math.sin(l.ang);
        if(dp>0 && dp<l.len){
          const px=l.x+Math.cos(l.ang)*dp;
          const py=l.y+Math.sin(l.ang)*dp;
          if(dist({x:px,y:py},player)<26) damagePlayer(l.dmg);
        }
      }
      FX.flash(l.x,l.y,'#fff',6,80,16);
      lasers.splice(i,1);
    }
  }
  for(let i=blackholes.length-1;i>=0;i--){
    const bh=blackholes[i];
    bh.r+=(bh.maxR-bh.r)*.06*ff; bh.life-=.015*ff;
    if(player.invuln<=0 && dist(bh,player)<40){
      player.vx+=(bh.x-player.x)*.05*ff;
      player.vy+=(bh.y-player.y)*.05*ff;
    }
    if(bh.life<=0) blackholes.splice(i,1);
  }
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];
    if(b.homing && alive){
      const ta=Math.atan2(player.y-b.y,player.x-b.x);
      const ca=Math.atan2(b.vy,b.vx);
      const na=ca+clamp(angDiff(ta,ca),-b.homing,b.homing);
      const s=Math.hypot(b.vx,b.vy);
      b.vx=Math.cos(na)*s; b.vy=Math.sin(na)*s;
    }
    b.x+=b.vx*slowMul*ff; b.y+=b.vy*slowMul*ff; b.life-=ff;
    if(b.x<-40||b.x>W+40||b.y<-40||b.y>H+40||b.life<=0){ ebullets.splice(i,1); continue; }
    if(player.invuln<=0 && dist(b,player)<player.r+b.r){
      if(stats.reflectChance>0 && Math.random()<stats.reflectChance){
        bullets.push(mkBullet(player.x,player.y-10,-b.vx,-b.vy,4,'#4dd2ff',2,0));
        FX.flash(b.x,b.y,'#4dd2ff',6,40,14);
        ebullets.splice(i,1); continue;
      }
      damagePlayer(8);
      FX.sparkBurst(player.x,player.y,'#7fffd4',8,6,5);
      ebullets.splice(i,1);
    }
  }
  const pullR=stats.magnetR||100;
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    d.x+=d.vx*ff; d.y+=d.vy*ff;
    d.vx*=.97; d.vy*=.97;
    d.bob+=.1*ff; d.life-=ff;
    const dd=dist(d,player);
    if(dd<pullR){ d.vx+=(player.x-d.x)/dd*ff; d.vy+=(player.y-d.y)/dd*ff; }
    if(dd<player.r+14){ pickup(d); drops.splice(i,1); continue; }
    if(d.life<=0) drops.splice(i,1);
  }
  if(comboTimer>0){ comboTimer-=ff; if(comboTimer<=0){
    if(stats.curseComboZero>0){
      player.hp-=stats.curseComboZero;
      if(player.hp<=0){ gameOver(); return; }
    }
    combo=0;
  } }
  updateFX(ff);
}
function updateFX(ff){
  FX.update(ff, player?player.vx:0, player?player.vy:0);
  if(shake>0) shake*=Math.pow(.86,ff); else shake=0;
  if(flash>0) flash-=.05*ff; else flash=0;
  if(impactWhite>0) impactWhite-=.08*ff; else impactWhite=0;
  if(aber>0) aber-=.06*ff; else aber=0;
  if(bombFlash>0) bombFlash-=.04*ff;
  if(banner>0) banner-=ff;
}
function damagePlayer(dmg){
  if(player.invuln>0||godMode) return;
  dmg=dmg*EFF.resist()*stats.curseDoubleDmg;
  if(stats.dodge>0 && Math.random()<stats.dodge){
    FX.ring(player.x,player.y,60,2,'#7fffd4');
    FX.text(player.x,player.y-40,'闪避','#7fffd4',16);
    player.invuln=20; return;
  }
  const bulwark=stats.evolution.bulwark||0;
  if(bulwark>0 && Math.random()<.2*bulwark){
    FX.ring(player.x,player.y,80,3,'#5aff9d');
    FX.text(player.x,player.y-40,'免疫','#5aff9d',16);
    player.invuln=20; SFX.shield(); return;
  }
  if(stats.thorns>0){
    const nearest=enemies.slice().sort((a,b)=>dist(a,player)-dist(b,player))[0];
    if(nearest && dist(nearest,player)<200){
      nearest.hp-=Math.ceil(3*stats.thorns);
      FX.sparkBurst(nearest.x,nearest.y,'#5aff9d',6,7,5);
      if(nearest.hp<=0) killEnemy(nearest);
    }
  }
  if(stats.timeFreezeOnHit>0 && Math.random()<.2*stats.timeFreezeOnHit){
    slowTimer=CFG.slow.duration; slowFlash=30;
    FX.text(player.x,player.y-40,'时停','#88e0ff',16);
  }
  if(player.shield>0){
    player.shield--; player.invuln=26;
    player.shieldGlow=20;
    FX.ring(player.x,player.y,100,3,'#5aff9d');
    FX.sparkBurst(player.x,player.y,'#5aff9d',14,8,6);
    impact(player.x,player.y,.8,'#5aff9d');
    FX.text(player.x,player.y-42,'SHIELD','#5aff9d',16);
    SFX.shield(); return;
  }
  player.hp-=dmg;
  player.invuln=CFG.player.invulnHit+stats.invulnExt;
  combo=0; comboTimer=0;
  impact(player.x,player.y,1.2,'#ff4d6d');
  SFX.hurt();
  c.style.filter='drop-shadow(6px 0 0 rgba(255,0,60,.6)) drop-shadow(-6px 0 0 rgba(0,255,255,.6))';
  setTimeout(()=>{ if(alive) c.style.filter=''; },110);
  if(player.hp<=0){
    if((stats.revive||0)>0){
      stats.revive--;
      player.hp=player.maxHp*.3;
      if(stats.taken.undying) player.hp=player.maxHp;
      player.invuln=200;
      bombFlash=.95;
      FX.flash(player.x,player.y,'#ffd166',20,Math.max(W,H)*.5,32);
      FX.flash(player.x,player.y,'#fff',14,200,26,Math.PI/16);
      FX.sparkBurst(player.x,player.y,'#ffd166',50,14,9);
      FX.glow(player.x,player.y,50,150,'#fff');
      FX.ring(player.x,player.y,260,4,'#ffd166');
      FX.text(player.x,player.y-70,'复生','#ffd166',24,true);
      SFX.bless(); return;
    }
    gameOver();
  }
}
function pickup(d){
  SFX.pickup();
  FX.ring(d.x,d.y,50,2,'#7fffd4');
  FX.flash(d.x,d.y,'#7fffd4',6,30,14);
  const buffMulP=stats.cursePickupBuff;
  stats2.pickups++; tickCurse('pickups',1);
  if(stats.cursePickupCost>0){
    player.hp-=stats.cursePickupCost;
    if(player.hp<=0){ gameOver(); return; }
  }
  if(d.type==='heal') player.hp=Math.min(player.maxHp,player.hp+30*buffMulP);
  else if(d.type==='weapon'){
    if(player.weapon<WEAPONS.length-1) player.weapon++;
    else score+=100;
  }
  else if(d.type==='bomb'){
    if(!stats.curseNoBomb) player.bomb=Math.min(CFG.bomb.max,player.bomb+1);
    else player.hp=Math.min(player.maxHp,player.hp+20);
  }
  else if(d.type==='shield'){ player.shield=Math.min(5,player.shield+1); player.shieldGlow=20; SFX.shield(); }
  else if(d.type==='slow'){ slowTimer=CFG.slow.duration; slowFlash=30; SFX.slow(); }
  emit('pickup',d.type);
}
function gameOver(){
  alive=false; shake=26; flash=1; aber=1.5;
  clearRun();
  if(score>SAVE.best){ SAVE.best=score; }
  addCoins(runCoins);
  saveMeta();
  c.style.filter='drop-shadow(10px 0 0 rgba(255,0,60,.7)) drop-shadow(-10px 0 0 rgba(0,255,255,.7))';
  setTimeout(()=>{ c.style.filter=''; },500);
  FX.flash(player.x,player.y,'#0ff',20,Math.max(W,H),32);
  FX.shardBurst(player.x,player.y,'#7fffd4',26,1.5);
  FX.sparkBurst(player.x,player.y,'#7fffd4',40,12,8);
  impact(player.x,player.y,3,'#0ff');
  document.getElementById('fs').textContent=score;
  document.getElementById('fw').textContent=wave;
  document.getElementById('fl').textContent=level;
  document.getElementById('fb').textContent=SAVE.best;
  document.getElementById('fg').textContent=runCoins;
  setTimeout(()=>{
    phase='over';
    skillsEl.classList.add('hide');
    document.getElementById('over').classList.add('show');
  },700);
  emit('gameover',{score,wave,level});
}

/* ============================================================
   渲染
   ============================================================ */
function render(ff){
  g.save();
  if(shake>.5) g.translate(rnd(-shake,shake),rnd(-shake,shake));

  g.fillStyle='#03040a';
  g.fillRect(-60,-60,W+120,H+120);
  drawStars(ff||1);

  for(const s of shockwaves){
    g.globalAlpha=s.life*.85;
    g.strokeStyle=s.color; g.lineWidth=4;
    g.beginPath(); g.arc(s.x,s.y,s.r,0,TAU); g.stroke();
  }
  g.globalAlpha=1;

  for(const l of lasers){
    const t=l.t/l.maxT;
    g.globalAlpha=.35+(1-t)*.6;
    g.strokeStyle=l.color; g.lineWidth=t>.2?2.5:7;
    g.beginPath(); g.moveTo(l.x,l.y);
    g.lineTo(l.x+Math.cos(l.ang)*l.len,l.y+Math.sin(l.ang)*l.len);
    g.stroke();
  }
  g.globalAlpha=1;

  for(const bh of blackholes){
    g.globalAlpha=bh.life*.7;
    const cg=g.createRadialGradient(bh.x,bh.y,2,bh.x,bh.y,bh.r);
    cg.addColorStop(0,'#000');
    cg.addColorStop(.5,'#c77dff');
    cg.addColorStop(1,'rgba(199,125,255,0)');
    g.fillStyle=cg;
    g.beginPath(); g.arc(bh.x,bh.y,bh.r,0,TAU); g.fill();
    g.globalAlpha=1;
  }

  FX.render();

  const DCOL={heal:'#7fffd4',weapon:'#c77dff',bomb:'#ffd166',shield:'#5aff9d',slow:'#88e0ff'};
  const DCH={heal:'+',weapon:'W',bomb:'B',shield:'S',slow:'T'};
  for(const d of drops){
    const pulse=1+Math.sin(d.bob)*.15;
    const col=DCOL[d.type]||'#fff';
    g.save();
    g.translate(d.x,d.y); g.scale(pulse,pulse);
    g.fillStyle='rgba(0,26,36,.85)';
    g.strokeStyle=col; g.lineWidth=2.5;
    g.beginPath();
    for(let i=0;i<6;i++){
      const ang=i/6*TAU + d.bob*.3;
      const px=Math.cos(ang)*12, py=Math.sin(ang)*12;
      i?g.lineTo(px,py):g.moveTo(px,py);
    }
    g.closePath(); g.fill(); g.stroke();
    g.fillStyle=col;
    g.font='bold 12px Consolas';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(DCH[d.type]||'?',0,1);
    g.restore();
    g.textAlign='left'; g.textBaseline='alphabetic';
  }

  if(player && (alive || player.hp>0)){
    const blink=player.invuln>0 && player.dashT<=0 && Math.floor(player.invuln/4)%2===0;
    if(!blink || godMode) drawPlayer(player);
  }

  for(const b of bullets){
    const tex=TexCache.getDot(b.color);
    for(let i=0;i<b.trail.length;i++){
      const t=b.trail[i];
      const a=i/b.trail.length*.5;
      g.globalAlpha=a;
      const s=b.r*(i/b.trail.length)*2.5;
      g.drawImage(tex,t.x-s/2,t.y-s/2,s,s);
    }
    g.globalAlpha=1;
    const s=b.r*3;
    g.drawImage(tex,b.x-s/2,b.y-s/2,s,s);
  }
  g.globalAlpha=1;

  for(const b of ebullets){
    const tex=TexCache.getDot(b.color);
    const s=b.r*3;
    g.drawImage(tex,b.x-s/2,b.y-s/2,s,s);
  }

  for(const e of enemies) drawEnemy(e);

  if(phase==='play' || phase==='over') drawHUD();
  if(phase==='play') drawJoystick();

  if(banner>0){
    const t=banner/CFG.waves.bannerTime;
    g.globalAlpha=Math.min(1,t*2.5);
    g.textAlign='center';
    const isBossBanner=bannerText==='BOSS';
    g.font=`bold ${isBossBanner?54:50}px Consolas`;
    g.fillStyle=isBossBanner?'#ff3366':'#7fffd4';
    g.fillText(bannerText,W/2,H/2-10);
    g.globalAlpha=1; g.textAlign='left';
  }

  g.restore();

  if(flash>0){ g.fillStyle=`rgba(255,60,100,${flash*.42})`; g.fillRect(0,0,W,H); }
  if(impactWhite>0){ g.fillStyle=`rgba(255,255,255,${impactWhite})`; g.fillRect(0,0,W,H); }
  if(bombFlash>0){ g.fillStyle=`rgba(255,255,255,${bombFlash*.5})`; g.fillRect(0,0,W,H); }
  if(player && player.hp<40 && alive){
    const p=1-player.hp/40;
    const vg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.7);
    vg.addColorStop(0,'rgba(255,0,60,0)');
    vg.addColorStop(1,`rgba(255,0,60,${p*.35})`);
    g.fillStyle=vg; g.fillRect(0,0,W,H);
  }
  if(slowTimer>0){
    const a=Math.min(.2,slowTimer/CFG.slow.duration*.2);
    g.fillStyle=`rgba(80,180,255,${a})`; g.fillRect(0,0,W,H);
  }
  if(activeCurses.length>0){
    const a=Math.min(.16,activeCurses.length*.06);
    const vg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
    vg.addColorStop(0,'rgba(120,0,40,0)');
    vg.addColorStop(1,`rgba(120,0,40,${a})`);
    g.fillStyle=vg; g.fillRect(0,0,W,H);
  }
  if(godMode){
    g.strokeStyle='rgba(255,209,102,.6)'; g.lineWidth=2;
    g.strokeRect(4,4,W-8,H-8);
  }
}

/* ============================================================
   玩家绘制
   ============================================================ */
function drawPlayer(p){
  g.save();
  g.translate(p.x,p.y);
  g.rotate(p.tilt);

  if(p.dashT>0){
    const t=p.dashT/15;
    g.globalAlpha=t*.85;
    g.strokeStyle='#fff'; g.lineWidth=3;
    g.beginPath(); g.arc(0,0,26+(1-t)*22,0,TAU); g.stroke();
    g.globalAlpha=t*.55;
    g.strokeStyle='#0ff'; g.lineWidth=4;
    g.beginPath(); g.arc(0,0,20+(1-t)*10,0,TAU); g.stroke();
    g.globalAlpha=1;
  } else if(p.invuln>0){
    g.globalAlpha=.45;
    g.strokeStyle='#0ff'; g.lineWidth=2;
    g.beginPath(); g.arc(0,0,21,0,TAU); g.stroke();
    g.globalAlpha=1;
  }

  if(p.shield>0){
    for(let i=0;i<p.shield;i++){
      g.globalAlpha=.35+Math.sin(Date.now()*.005+i)*.12;
      g.strokeStyle='#5aff9d'; g.lineWidth=2.5;
      g.beginPath(); g.arc(0,0,24+i*5,0,TAU); g.stroke();
    }
    g.globalAlpha=1;
  }

  const flick=rnd(.7,1.25);
  const fl=20*flick*p.thr+(p.dashT>0?28:0);
  const fgOuter=g.createLinearGradient(0,10,0,10+fl*1.3);
  fgOuter.addColorStop(0,'rgba(120,220,255,.6)');
  fgOuter.addColorStop(.4,'rgba(0,180,255,.35)');
  fgOuter.addColorStop(1,'rgba(0,80,200,0)');
  g.fillStyle=fgOuter;
  g.beginPath();
  g.moveTo(-7,10); g.lineTo(0,10+fl*1.3); g.lineTo(7,10);
  g.closePath(); g.fill();
  const fgInner=g.createLinearGradient(0,10,0,10+fl);
  fgInner.addColorStop(0,'rgba(255,255,255,.95)');
  fgInner.addColorStop(.3,'rgba(180,255,255,.75)');
  fgInner.addColorStop(1,'rgba(0,200,255,0)');
  g.fillStyle=fgInner;
  g.beginPath();
  g.moveTo(-4,10); g.lineTo(0,10+fl); g.lineTo(4,10);
  g.closePath(); g.fill();

  if(p.muzzle>0){
    const w=WEAPONS[p.weapon]||WEAPONS[0];
    g.globalAlpha=p.muzzle/4;
    g.fillStyle='#cff';
    g.beginPath(); g.arc(0,-22,7,0,TAU); g.fill();
    g.globalAlpha=1;
  }

  g.fillStyle='#0b2b2b';
  g.strokeStyle='#7fffd4'; g.lineWidth=2;
  g.beginPath();
  g.moveTo(0,-22);
  g.lineTo(4,-10);
  g.lineTo(7,-4);
  g.lineTo(17,11);
  g.lineTo(6,7);
  g.lineTo(3,13);
  g.lineTo(-3,13);
  g.lineTo(-6,7);
  g.lineTo(-17,11);
  g.lineTo(-7,-4);
  g.lineTo(-4,-10);
  g.closePath();
  g.fill(); g.stroke();

  g.strokeStyle='rgba(127,255,212,.5)'; g.lineWidth=1;
  g.beginPath();
  g.moveTo(0,-18); g.lineTo(0,8);
  g.moveTo(-8,0); g.lineTo(-14,8);
  g.moveTo(8,0); g.lineTo(14,8);
  g.stroke();

  const cg=g.createRadialGradient(0,-6,1,0,-6,7);
  cg.addColorStop(0,'#fff');
  cg.addColorStop(.4,'#bfffff');
  cg.addColorStop(.7,'#4fe');
  cg.addColorStop(1,'#066');
  g.fillStyle=cg;
  g.beginPath(); g.ellipse(0,-7,3.8,6.5,0,0,TAU); g.fill();

  g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,-22); g.lineTo(0,7); g.stroke();

  if(combo>0){
    const mult=comboMult();
    const s=1+mult*.15;
    const col=mult>=3?'#ff4d6d':mult>=2?'#ffd166':'#7fffd4';
    g.globalAlpha=.3+Math.sin(Date.now()*.008)*.13;
    g.strokeStyle=col; g.lineWidth=2;
    g.beginPath(); g.arc(0,0,30*s,0,TAU); g.stroke();
    g.globalAlpha=1;
  }

  if(buffs.length>0){
    const t=Date.now()*.003;
    for(let i=0;i<buffs.length;i++){
      const b=buffs[i];
      const d=BUFF_DEFS[b.id];
      const a=(i/buffs.length)*TAU + t;
      g.globalAlpha=.65+Math.sin(t*4+i)*.2;
      g.fillStyle=d.c;
      g.beginPath(); g.arc(Math.cos(a)*36, Math.sin(a)*36, 3.5, 0, TAU); g.fill();
    }
    g.globalAlpha=1;
  }

  g.restore();
}

function drawEnemy(e){
  g.save();
  g.translate(e.x,e.y);
  g.rotate(e.ang+Math.PI/2);
  const col=e.hit>0?'#fff':e.color;
  if(e.type==='boss') drawBoss(e,g);
  else {
    g.fillStyle=col; g.strokeStyle=col; g.lineWidth=2;
    e.def.draw(e,g);
  }
  if(e.slowT>0){
    g.strokeStyle='#88e0ff'; g.lineWidth=1.5; g.globalAlpha=.55;
    g.beginPath(); g.arc(0,0,e.r+5,0,TAU); g.stroke();
    g.globalAlpha=1;
  }
  if(e.poisonT>0){
    g.strokeStyle='#5aff9d'; g.lineWidth=1.5; g.globalAlpha=.55;
    g.beginPath(); g.arc(0,0,e.r+8,0,TAU); g.stroke();
    g.globalAlpha=1;
  }
  if(e.spawn>0){
    g.globalAlpha=e.spawn/20;
    g.strokeStyle='#fff'; g.lineWidth=2;
    g.beginPath(); g.arc(0,0,e.r+8,0,TAU); g.stroke();
    g.globalAlpha=1;
  }
  if(e.invuln>0){
    g.globalAlpha=.5;
    g.strokeStyle='#fff'; g.lineWidth=3;
    g.beginPath(); g.arc(0,0,e.r+12,0,TAU); g.stroke();
    g.globalAlpha=1;
  }
  if(e.hp<e.maxHp && e.maxHp>1 && e.type!=='boss'){
    g.rotate(-(e.ang+Math.PI/2));
    const w=e.r*2;
    g.fillStyle='rgba(0,0,0,.65)';
    g.fillRect(-w/2,e.r+8,w,4);
    g.fillStyle=e.color;
    g.fillRect(-w/2,e.r+8,w*(e.hp/e.maxHp),4);
  }
  g.restore();
}

/* ============================================================
   管理员命令行
   ============================================================ */
const ADM = {
  history: [], histIdx: -1, commands: {},
  register(name, meta){ this.commands[name] = meta; },
  list(){
    const cats={};
    for(const n of Object.keys(this.commands).sort()){
      const cat=this.commands[n].cat||'misc';
      (cats[cat] ||= []).push(n);
    }
    return cats;
  },
  async exec(line){
    const trimmed=line.trim();
    if(!trimmed) return '';
    const m=trimmed.replace(/^[\/~]/,'').match(/^(\S+)\s*(.*)$/);
    if(!m) return '';
    const [_,name,argStr]=m;
    const cmd=this.commands[name];
    if(!cmd) return {ok:false, msg:'未知命令: '+name};
    const args=[];
    const re=/"([^"]*)"|'([^']*)'|(\S+)/g;
    let match;
    while((match=re.exec(argStr))) args.push(match[1]??match[2]??match[3]);
    try {
      const result = await cmd.fn(args);
      return {ok:true, msg:result==null?'OK':String(result)};
    } catch(e){
      return {ok:false, msg:'错误: '+(e.message||e)};
    }
  }
};
const admLogEl=document.getElementById('admLog');
const admInputEl=document.getElementById('admInput');
const admEl=document.getElementById('adm');
const admAcEl=document.getElementById('admAutocomplete');
function admPrint(line, cls){
  const el=document.createElement('div');
  el.className='admLine '+(cls||'');
  el.textContent=line;
  admLogEl.appendChild(el);
  admLogEl.scrollTop=admLogEl.scrollHeight;
  while(admLogEl.childNodes.length>300) admLogEl.removeChild(admLogEl.firstChild);
}
function openAdmin(){
  admOpen=true; admEl.classList.add('show');
  setTimeout(()=>admInputEl.focus(),50);
  if(!admLogEl.childElementCount){
    admPrint('Seagull Admin Console v19','admDim');
    admPrint('输入 /help 查看命令。','admDim');
    admPrint('-------------------------------','admDim');
  }
}
function closeAdmin(){
  admOpen=false; admEl.classList.remove('show');
  admAcEl.classList.remove('show');
  admInputEl.blur();
}
document.getElementById('admBtn').addEventListener('click',()=>{ initAudio(); openAdmin(); });
document.getElementById('admClose').addEventListener('click',closeAdmin);
admInputEl.addEventListener('keydown', async e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    const v=admInputEl.value;
    if(!v.trim()) return;
    admPrint('seagull> '+v,'admCmd');
    ADM.history.unshift(v);
    if(ADM.history.length>50) ADM.history.pop();
    ADM.histIdx=-1;
    admInputEl.value='';
    admAcEl.classList.remove('show');
    const r=await ADM.exec(v);
    if(typeof r==='string'){ if(r) admPrint(r,'admOk'); }
    else if(r && r.ok) admPrint(r.msg,'admOk');
    else if(r) admPrint(r.msg||'','admErr');
    SFX.cmd();
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(ADM.history.length){
      ADM.histIdx=Math.min(ADM.history.length-1, ADM.histIdx+1);
      admInputEl.value=ADM.history[ADM.histIdx];
    }
  } else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(ADM.histIdx>0){ ADM.histIdx--; admInputEl.value=ADM.history[ADM.histIdx]; }
    else { ADM.histIdx=-1; admInputEl.value=''; }
  } else if(e.key==='Tab'){
    e.preventDefault();
    const v=admInputEl.value;
    const m=v.match(/^\s*[\/~]?(\S*)$/);
    if(m){
      const cands=Object.keys(ADM.commands).filter(n=>n.startsWith(m[1]));
      if(cands.length===1){ admInputEl.value='/'+cands[0]+' '; admAcEl.classList.remove('show'); }
      else if(cands.length>1){ showAcList(cands); }
    }
  } else if(e.key==='Escape'){ closeAdmin(); }
  else {
    const v=admInputEl.value;
    const m=v.match(/^\s*[\/~]?(\S*)$/);
    if(m && m[1]){
      const cands=Object.keys(ADM.commands).filter(n=>n.startsWith(m[1]));
      if(cands.length && cands.length<=8) showAcList(cands);
      else admAcEl.classList.remove('show');
    } else admAcEl.classList.remove('show');
  }
});
function showAcList(names){
  admAcEl.innerHTML='';
  names.forEach((n)=>{
    const cmd=ADM.commands[n];
    const el=document.createElement('div');
    el.className='acItem';
    el.innerHTML=`<span class="acN">/${n}</span><span class="acD">${cmd.desc||''}</span>`;
    el.addEventListener('pointerdown',ev=>{
      ev.preventDefault();
      admInputEl.value='/'+n+' ';
      admAcEl.classList.remove('show');
      admInputEl.focus();
    });
    admAcEl.appendChild(el);
  });
  admAcEl.classList.add('show');
}
ADM.register('help',{cat:'core',desc:'显示所有命令',usage:'/help [命令]',
  fn(args){
    if(args[0]){
      const cmd=ADM.commands[args[0]];
      if(!cmd) return `未知命令: ${args[0]}`;
      return `/${args[0]}\n  ${cmd.desc}\n  用法: ${cmd.usage||'/'+args[0]}`;
    }
    const cats=ADM.list();
    const lines=['命令列表:'];
    for(const cat of Object.keys(cats).sort()){
      lines.push('');
      lines.push('['+cat.toUpperCase()+']');
      for(const n of cats[cat]){
        lines.push('  /'+n.padEnd(14)+' '+(ADM.commands[n].desc||''));
      }
    }
    return lines.join('\n');
  }
});
ADM.register('give',{cat:'save',desc:'发放资源',usage:'/give <coins|xp> <数量>',
  fn(args){
    const what=args[0], n=parseInt(args[1],10);
    if(!what||isNaN(n)) throw new Error('用法: /give <coins|xp> <数量>');
    if(what==='coins'){ addCoins(n); return '金币: '+SAVE.coins; }
    if(what==='xp'){ gainXP(n); return '经验 +'+n; }
    throw new Error('不支持的资源: '+what);
  }
});
ADM.register('coins',{cat:'save',desc:'金币操作',usage:'/coins <get|set|add> [n]',
  fn(args){
    const op=args[0]||'get';
    if(op==='get') return '金币: '+SAVE.coins;
    const n=parseInt(args[1],10);
    if(isNaN(n)) throw new Error('需要数量');
    if(op==='set'){ SAVE.coins=Math.max(0,n); saveMeta(); refreshCoins();
      return '金币设为 '+SAVE.coins; }
    if(op==='add'){ addCoins(n); return '金币 '+SAVE.coins; }
    throw new Error('未知操作: '+op);
  }
});
ADM.register('unlock',{cat:'save',desc:'解锁全部装备',usage:'/unlock all',
  fn(){
    ALL_ITEMS.forEach(i=>SAVE.owned[i.id]=1);
    saveMeta(); backupMeta();
    renderEquip();
    return '已解锁全部 '+ALL_ITEMS.length+' 件';
  }
});
ADM.register('equip',{cat:'save',desc:'装备/卸下',usage:'/equip <itemId>',
  fn(args){
    const id=args[0];
    if(!id) throw new Error('需要 itemId');
    if(!ITEM_MAP[id]) throw new Error('不存在: '+id);
    equipItem(id);
    return '已切换: '+ITEM_MAP[id].n;
  }
});
ADM.register('save',{cat:'save',desc:'手动保存',usage:'/save',
  fn(){
    saveMeta(); backupMeta();
    if(phase==='play' && alive) saveRun();
    return '已保存全部数据';
  }
});
ADM.register('runinfo',{cat:'save',desc:'查看存档信息',usage:'/runinfo',
  fn(){
    const r=hasRun(); const b=hasBackup();
    const lines=[];
    lines.push('永久存档:');
    lines.push('  金币: '+SAVE.coins);
    lines.push('  装备: '+Object.keys(SAVE.owned).length+'/'+TOTAL_ITEMS);
    lines.push('  最高分: '+SAVE.best);
    lines.push('  保底: '+SAVE.pity+'/'+PITY);
    if(r){
      lines.push('局内进度:');
      lines.push('  WAVE '+r.wave+' · LV '+r.level+' · HP '+r.player.hp);
      lines.push('  得分: '+r.score);
    } else lines.push('局内进度: 无');
    if(b) lines.push('备份: 金币 '+b.coins+' · 装备 '+Object.keys(b.owned||{}).length);

ADM.register('clear-run',{cat:'save',desc:'清空局内进度',usage:'/clear-run',

});
ADM.register('reset',{cat:'save',desc:'清空所有存档',usage:'/reset',
  fn(){
    setTimeout(()=>{
      localStorage.removeItem(META_KEY);
      localStorage.removeItem(RUN_KEY);
      localStorage.removeItem(BAK_KEY);

ADM.register('draw',{cat:'gacha',desc:'免费抽奖',usage:'/draw [n]',
  fn(args){
    const n=Math.max(1,Math.min(100,parseInt(args[0],10)||1));
    const results=doGacha(n,true);
    const counts={mythic:0,legend:0,epic:0,rare:0,common:0};
    results.forEach(r=>counts[r.rarity]++);
    return '免费 '+n+' 连结果（已入库+备份）:\n'+
      Object.entries(counts).filter(([_,v])=>v>0)
        .map(([k,v])=>'  '+RAR_MAP[k].n.padEnd(4)+' x '+v).join('\n');
  }
});
ADM.register('god',{cat:'buff',desc:'切换上帝模式',usage:'/god [on|off]',
  fn(args){
    const op=args[0];
    if(op==='on') godMode=true;
    else if(op==='off') godMode=false;
    else godMode=!godMode;
    return '上帝模式: '+(godMode?'ON':'OFF');
  }
});
ADM.register('heal',{cat:'buff',desc:'回满生命+护盾',usage:'/heal',
  fn(){ player.hp=player.maxHp; player.shield=5; player.shieldGlow=20; return '已回满'; }
});
ADM.register('spawn',{cat:'combat',desc:'生成敌人',usage:'/spawn <type> [n]',
  fn(args){
    const type=args[0];
    if(!ENEMY_DEFS[type]) throw new Error('未知敌人: '+type+
      '（可用: '+Object.keys(ENEMY_DEFS).join(', ')+'）');
    const n=clamp(parseInt(args[1],10)||1,1,50);
    for(let i=0;i<n;i++) spawnEnemy(type,rnd(80,W-80),-40-i*20);
    return '已生成 '+n+' 个 '+type;
  }
});
ADM.register('boss',{cat:'combat',desc:'生成 BOSS',usage:'/boss [id|random]',
  fn(args){
    let def;
    if(!args[0]||args[0]==='random') def=BOSS_DEFS[Math.floor(Math.random()*BOSS_DEFS.length)];
    else def=BOSS_DEFS.find(b=>b.id===args[0]);
    if(!def) throw new Error('未知 BOSS: '+args[0]);
    const e={type:'boss',x:W/2,y:-120,r:def.r,
      hp:def.hp,maxHp:def.hp,spd:def.spd,color:def.color,score:def.score,
      cdBase:def.cd,cd:60,ang:Math.PI/2,hit:0,spawn:60,invuln:0,pattern:0,
      bossDef:def,def:null,skillTimer:0};
    enemies.push(e);
    return '已生成 BOSS: '+def.name;
  }
});
ADM.register('killall',{cat:'combat',desc:'清空敌人',usage:'/killall',
  fn(){
    let n=0;
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(e.type==='boss') continue;
      killEnemy(e,true); n++;
    }
    ebullets.length=0;
    return '已清空 '+n+' 个敌人';
  }
});
ADM.register('wave',{cat:'combat',desc:'跳转波次',usage:'/wave <n>',
  fn(args){
    const n=parseInt(args[0],10);
    if(isNaN(n)||n<1) throw new Error('需要波次数字');
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(e.type!=='boss') killEnemy(e,true);
    }
    enemies.length=0;
    wave = n-1;
    waveCleared = false;
    waveTimer = 10;
    banner = CFG.waves.bannerTime;
    bannerText = 'WAVE '+n;
    return '即将进入第 '+n+' 波';
  }
});
ADM.register('level',{cat:'progress',desc:'提升等级',usage:'/level [n]',
  fn(args){
    const n=clamp(parseInt(args[0],10)||1,1,50);
    level+=n; pendingLevels+=n;
    xpNeed=Math.round(xpNeed*Math.pow(CFG.level.growth,n));
    return '提升 '+n+' 级';
  }
});

  fn(args){

    const px=player?player.x:W/2, py=player?player.y:H/2;

   ============================================================ */
const startMenuEl=document.getElementById('start');
const gachaUIEl=document.getElementById('gachaUI');
const equipUIEl=document.getElementById('equipUI');
const saveUIEl=document.getElementById('saveUI');

function showMenu(){
  startMenuEl.style.display='flex';
  refreshCoins();
  updateContinueBtn();
}
function hideMenu(){ startMenuEl.style.display='none'; }

function updateContinueBtn(){
  const btn=document.getElementById('btnContinue');
  if(!btn) return;
  const r=hasRun();
  if(r){
    btn.style.display='';
    btn.textContent='继 续 W'+r.wave+' LV'+r.level;
  } else btn.style.display='none';
}

document.getElementById('startBtns').addEventListener('click',e=>{
  const k=e.target.dataset && e.target.dataset.k;
  if(!k) return;
  initAudio();
  if(k==='play'){ clearRun(); startGame(true); }
  if(k==='continue') continueGame();
  if(k==='gacha'){
    hideMenu();
    gachaUIEl.classList.add('show');
    document.getElementById('gachaGrid').innerHTML='';
    refreshCoins();
  }
  if(k==='equip'){
    hideMenu();
    equipUIEl.classList.add('show');
    currentSlotFilter=null;
    renderEquip();
  }
  if(k==='save'){
    hideMenu();
    saveUIEl.classList.add('show');
    renderSavePanel();
  }
  if(k==='adm') openAdmin();
});
document.getElementById('gachaBack').addEventListener('click',()=>{
  gachaUIEl.classList.remove('show'); showMenu();
});
document.getElementById('equipBack').addEventListener('click',()=>{
  equipUIEl.classList.remove('show'); showMenu();
});
document.getElementById('saveBack').addEventListener('click',()=>{
  saveUIEl.classList.remove('show'); showMenu();
});
document.getElementById('gachaBtnBar').addEventListener('click',e=>{
  const k=e.target.dataset && e.target.dataset.k;
  if(k==='one') doGacha(1);
  if(k==='ten') doGacha(10);
});
let cheatClicks=0, cheatTimer=null;
document.getElementById('coinBar').addEventListener('click',()=>{
  cheatClicks++; clearTimeout(cheatTimer);
  cheatTimer=setTimeout(()=>cheatClicks=0,800);
  if(cheatClicks>=7){
    cheatClicks=0;
    addCoins(99999); showToast('+99999 金币');
  }
});

const bootEl=document.getElementById('boot');
const bootText=document.getElementById('bootText');
const bootFlash=document.getElementById('bootFlash');
const bootRing=document.getElementById('bootRing');
const overEl=document.getElementById('over');

function startGame(withBoot){
  initAudio();
  if(withBoot){
    hideMenu();
    bootEl.classList.add('show');
    bootText.classList.remove('on');
    void bootText.offsetWidth;
    requestAnimationFrame(()=>bootText.classList.add('on'));
    SFX.boot();
    setTimeout(()=>{ bootRing.classList.add('go'); bootFlash.classList.add('go'); }, 1150);
    setTimeout(()=>bootEl.classList.add('fade'), 2050);
    setTimeout(()=>{
      bootEl.classList.remove('show','fade');
      bootText.classList.remove('on');
      bootFlash.classList.remove('go');
      bootRing.classList.remove('go');
      beginPlay(false);
    }, 2500);
  } else beginPlay(false);
}
function continueGame(){
  if(!hasRun()){ showToast('没有可用的存档'); return; }
  hideMenu();
  beginPlay(true);
}
function beginPlay(fromSave){
  if(fromSave && loadRun()){
    phase='play';
    skillsEl.classList.remove('hide');
    overEl.classList.remove('show');
    luEl.classList.remove('show');
    luBusy=false;
    updateSkillUI();
    showToast('已恢复 · WAVE '+wave+' · LV '+level);
    return;
  }
  restart();
  phase='play';
  skillsEl.classList.remove('hide');
  overEl.classList.remove('show');
  luEl.classList.remove('show');
  luBusy=false;
  runCoins=0;
  updateSkillUI();
  spawnWave();
  saveRun();
}
document.getElementById('againBtn').addEventListener('click',()=>{
  phase='menu';
  overEl.classList.remove('show');
  showMenu();
});
